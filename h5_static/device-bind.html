<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>设备绑定</title>
<style>
  :root{--brand:#2563eb;--line:#e2e8f0;--muted:#64748b;--ok:#059669;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:#f5f7fb;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:18px;margin:4px 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:#334155}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:#fff;font-size:14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  button:disabled{opacity:.5}
  input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px}
  input[type=file]{display:none}
  .muted{color:var(--muted);font-size:12px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}
  .kv b{color:#475569;font-weight:600}
  pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px;font-size:12px;overflow:auto;max-height:220px}
  .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);background:#f8fafc}
  .badge.ok{color:var(--ok);border-color:rgba(5,150,105,.35);background:rgba(5,150,105,.08)}
  .badge.wait{color:#b45309;border-color:rgba(180,83,9,.35);background:rgba(180,83,9,.08)}
  .badge.bad{color:var(--bad);border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.08)}
  #photo{max-width:100%;border-radius:8px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>设备绑定</h1>

  <div class="card">
    <h2>1. 扫描设备上的二维码</h2>
    <div class="row">
      <button id="btnPhoto">拍照扫码</button>
      <button id="btnAlbum" class="ghost">从相册选</button>
      <button id="btnManual" class="ghost">手动粘贴</button>
      <input type="file" id="fileQr" accept="image/*" capture="environment" />
    </div>
    <img id="photo" alt="" />
    <div id="camBox" style="display:none;margin-top:10px">
      <video id="camVideo" playsinline muted autoplay style="width:100%;max-width:420px;border-radius:10px;background:#000"></video>
      <div class="row" style="margin-top:8px"><button id="btnCamClose" class="ghost">关闭摄像头</button></div>
      <div class="muted">把设备屏幕上的二维码放进取景框，识别到会自动继续</div>
    </div>
    <div id="manualBox" class="row" style="margin-top:10px;display:none">
      <input type="text" id="manualInput" placeholder="粘贴二维码内容，例如 http://192.168.1.105:8080/pair?code=8F4C92D7" />
      <button id="btnManualParse">解析</button>
    </div>
    <div class="muted" style="margin-top:8px">二维码形如 <code>http://&lt;设备IP&gt;:8080/pair?code=XXXXXXXX</code></div>
  </div>

  <div class="card">
    <h2>2. 配对信息</h2>
    <div class="kv" id="parsedBox">
      <b>设备地址</b><span id="vBase">—</span>
      <b>配对码</b><span id="vCode">—</span>
      <b>登录态</b><span id="vToken">—</span>
      <b>局域网桥</b><span id="vBridge">—</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnBind">发送绑定请求</button>
      <span id="bindState" class="badge">未开始</span>
    </div>
  </div>

  <div class="card">
    <h2>3. 绑定结果</h2>
    <div class="kv" id="resultBox">
      <b>设备号</b><span id="vDevice">—</span>
      <b>名称</b><span id="vName">—</span>
      <b>协议版本</b><span id="vProto">—</span>
      <b>绑定状态</b><span id="vStatus">—</span>
    </div>
  </div>

  <div class="card">
    <h2>日志</h2>
    <pre id="log">ready</pre>
  </div>
</div>
<script src="/h5-static/jsQR.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { base: '', code: '', ticket: '', expiresAt: 0, timer: null };

  function log(msg) {
    var el = $('log');
    el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
  }
  function setBadge(text, cls) {
    var el = $('bindState');
    el.textContent = text;
    el.className = 'badge' + (cls ? ' ' + cls : '');
  }
  // 设备接口只在主站提供（h5.bhzn.top 不代理 /api/device/*，直接调会 404），
  // 所以这里优先用配置的 API 基址，否则 *.bhzn.top 一律回主站。
  function origin() {
    try {
      var fromStorage = localStorage.getItem('lobster_api_base');
      if (fromStorage) return String(fromStorage).replace(/\/$/, '');
      if (window.__LOBSTER_API_BASE) return String(window.__LOBSTER_API_BASE).replace(/\/$/, '');
    } catch (e) {}
    var host = String(location.hostname || '').toLowerCase();
    if (host === 'bhzn.top' || host.slice(-9) === '.bhzn.top') return 'https://bhzn.top';
    return location.origin;
  }

  function findToken() {
    try {
      var best = '';
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        if (k.indexOf('lobster_h5_token') === -1) continue;
        var v = localStorage.getItem(k) || '';
        if (v.split('.').length === 3 && v.length > best.length) best = v;
      }
      if (best) return best;
    } catch (e) {}
    try { return localStorage.getItem('lobster_h5_token') || ''; } catch (e) { return ''; }
  }

  function hasBridge() {
    return !!(window.LobsterAndroid && typeof window.LobsterAndroid.lanHttp === 'function');
  }

  function parseQr(text) {
    var m = /^(https?:\/\/[^\s]+?)\/pair\?code=([A-Za-z0-9_-]+)/i.exec(String(text || '').trim());
    if (!m) return null;
    return { base: m[1].replace(/\/$/, ''), code: m[2] };
  }

  function applyParsed(p) {
    state.base = p.base; state.code = p.code;
    $('vBase').textContent = p.base;
    $('vCode').textContent = p.code;
    var token = findToken();
    $('vToken').textContent = token ? ('已获取（' + token.slice(0, 12) + '…）') : '未登录（请先在 App 里登录）';
    $('vBridge').textContent = hasBridge() ? '可用（LobsterAndroid.lanHttp）' : '不可用（浏览器/未更新 App）';
    setBadge('已解析，可以绑定', 'wait');
    log('已解析二维码：' + p.base + ' code=' + p.code);
  }

  function decodePhoto(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (typeof window.jsQR !== 'function') { reject(new Error('二维码解析库未加载')); return; }
        var res = window.jsQR(data.data, data.width, data.height, { inversionAttempts: 'dontInvert' });
        resolve(res ? res.data : '');
      };
      img.onerror = function () { reject(new Error('图片读取失败')); };
      img.src = URL.createObjectURL(file);
    });
  }

  // 原生桥：异步回包 window.__lobsterBridge.onLanHttp(requestId, jsonString)
  var pendingLan = {};
  window.__lobsterBridge = window.__lobsterBridge || {};
  window.__lobsterBridge.onLanHttp = function (requestId, resultJson) {
    var cb = pendingLan[requestId];
    if (!cb) return;
    delete pendingLan[requestId];
    var res = {};
    try { res = typeof resultJson === 'string' ? JSON.parse(resultJson) : (resultJson || {}); } catch (e) { res = { ok: false, error: '返回解析失败' }; }
    cb(res);
  };

  function lanRequest(url, method, headers, body, timeoutMs) {
    return new Promise(function (resolve) {
      if (!hasBridge()) { resolve({ ok: false, error: 'no_bridge' }); return; }
      var id = 'lan_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      pendingLan[id] = resolve;
      try {
        window.LobsterAndroid.lanHttp(id, url, method || 'GET', JSON.stringify(headers || {}), body || '', timeoutMs || 10000);
      } catch (e) {
        delete pendingLan[id];
        resolve({ ok: false, error: String(e && e.message || e) });
      }
      setTimeout(function () {
        if (pendingLan[id]) { delete pendingLan[id]; resolve({ ok: false, error: 'timeout' }); }
      }, (timeoutMs || 10000) + 2000);
    });
  }

  async function bindTicket(apiBaseUrl) {
    var token = findToken();
    if (!token) throw new Error('未登录：请先在 App 里登录');
    var res = await fetch(origin() + '/api/device/bind-ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ api_base_url: apiBaseUrl || origin() }),
    });
    if (!res.ok) throw new Error('取绑定票据失败 HTTP ' + res.status);
    return await res.json();
  }

  async function pollStatus() {
    var res = await fetch(origin() + '/api/device/bind/status?ticket=' + encodeURIComponent(state.ticket));
    if (!res.ok) return null;
    return await res.json();
  }

  function renderStatus(s) {
    if (!s) return;
    $('vDevice').textContent = s.device_id || '—';
    $('vName').textContent = s.name || '—';
    $('vProto').textContent = s.protocol_version || '—';
    $('vStatus').textContent = s.bind_status || '—';
    if (s.bind_status === 'bound') setBadge('绑定成功', 'ok');
    else if (s.bind_status === 'expired') setBadge('票据过期，请重新扫码', 'bad');
    else setBadge('等待设备回报…', 'wait');
  }

  async function doBind() {
    if (!state.base || !state.code) { alert('请先扫描或粘贴二维码'); return; }
    $('btnBind').disabled = true;
    try {
      setBadge('取票据中…', 'wait');
      var info = await bindTicket(origin());
      state.ticket = info.ticket; state.expiresAt = info.expires_at;
      log('已取到绑定票据 ' + String(info.ticket).slice(0, 14) + '… 有效期 ' + info.expires_in + 's');
      var payload = {
        bind_ticket: info.ticket,
        user_token: findToken(),
        expires_at: info.expires_at,
        api_base_url: info.api_base_url || origin(),
        code: state.code,
      };
      var url = state.base + '/api/device/bind';
      var r = await lanRequest(url, 'POST', { 'Content-Type': 'application/json' }, JSON.stringify(payload), 10000);
      if (!r.ok && r.error === 'no_bridge') {
        log('⚠️ 当前没有原生局域网桥：WebView 里直接请求局域网 http 会被拦，请用最新版 App（或本页在浏览器里打开测试）');
        setBadge('缺少局域网桥', 'bad');
        return;
      }
      log('设备返回：' + JSON.stringify(r).slice(0, 200));
      setBadge('等待设备回报…', 'wait');
      var tries = 0;
      clearInterval(state.timer);
      state.timer = setInterval(async function () {
        tries++;
        var s = await pollStatus().catch(function () { return null; });
        if (s) { renderStatus(s); }
        if ((s && s.bind_status === 'bound') || tries > 30) { clearInterval(state.timer); }
      }, 2000);
    } catch (e) {
      setBadge(String(e && e.message || e), 'bad');
      log('绑定失败：' + String(e && e.message || e));
    } finally {
      $('btnBind').disabled = false;
    }
  }

  // 拍照扫码：带 capture 直接拉起摄像头；从相册选：去掉 capture 打开图库
// 实时扫码：点击「拍照扫码」直接拉起摄像头（WebView/浏览器都可能给相机权限）
var live = { stream: null, raf: 0, lastIgnored: '', startedAt: 0, hinted: false };
function stopLiveScan() {
  if (live.stream) { try { live.stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} live.stream = null; }
  if (live.raf) { cancelAnimationFrame(live.raf); live.raf = 0; }
  var box = $('camBox'); if (box) box.style.display = 'none';
}
function startLiveScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
  return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(function (stream) {
      live.stream = stream;
      live.startedAt = Date.now();
      live.hinted = false;
      var video = $('camVideo');
      video.srcObject = stream;
      $('camBox').style.display = 'block';
      log('摄像头已打开，对准二维码即可');
      return video.play().catch(function () {});
    })
    .then(function () {
      var canvas = document.createElement('canvas');
      function tick() {
        if (!live.stream) return;
        var video = $('camVideo');
        try {
          if (video.videoWidth) {
            var vw = video.videoWidth, vh = video.videoHeight, side = Math.max(vw, vh) || 1;
            var scale = Math.min(1, 1440 / side);
            canvas.width = Math.max(1, Math.round(vw * scale));
            canvas.height = Math.max(1, Math.round(vh * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var res = (typeof window.jsQR === 'function') ? window.jsQR(data.data, data.width, data.height, { inversionAttempts: 'attemptBoth' }) : null;
            if (res && res.data) {
              var qrText = String(res.data).trim();
              if (/^https?:\/\/[^\s]+?\/pair\?code=[A-Za-z0-9_-]+/i.test(qrText)) {
                stopLiveScan();
                applyParsed(qrText);
                return;
              }
              if (qrText !== live.lastIgnored) {
                live.lastIgnored = qrText;
                log('这帧没解全（' + qrText.slice(0, 40) + '），继续对准二维码…');
              }
            }
          }
        } catch (e) {}
        if (!live.hinted && live.startedAt && Date.now() - live.startedAt > 8000) {
          live.hinted = true;
          log('识别有点慢：靠近一点、避开反光，或改用「从相册选」拍一张');
        }
        live.raf = requestAnimationFrame(tick);
      }
      live.raf = requestAnimationFrame(tick);
      return true;
    })
    .catch(function (err) { stopLiveScan(); log('摄像头没打开（' + (err && err.message || err) + '），改用拍照/相册'); return false; });
}
$('btnPhoto').addEventListener('click', function () {
  startLiveScan().then(function (ok) {
    if (ok) return;
    var input = $('fileQr');
    input.value = '';
    input.setAttribute('capture', 'environment');
    input.click();
  });
});
var camClose = $('btnCamClose');
if (camClose) camClose.addEventListener('click', stopLiveScan);

$('btnAlbum').addEventListener('click', function () {
  var input = $('fileQr');
  input.value = '';
  input.removeAttribute('capture');
  input.click();
});
  $('fileQr').addEventListener('change', async function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var img = $('photo'); img.src = URL.createObjectURL(f); img.style.display = 'block';
    try {
      var text = await decodePhoto(f);
      if (!text) { log('没有识别到二维码，请重拍/靠近一点'); return; }
      var p = parseQr(text);
      if (!p) { log('二维码内容不是预期格式：' + text); return; }
      applyParsed(p);
    } catch (e) { log('解析失败：' + String(e && e.message || e)); }
  });
  $('btnManual').addEventListener('click', function () {
    var box = $('manualBox'); box.style.display = box.style.display === 'none' ? 'flex' : 'none';
  });
  $('btnManualParse').addEventListener('click', function () {
    var p = parseQr($('manualInput').value);
    if (!p) { alert('格式不对，应形如 http://192.168.1.105:8080/pair?code=8F4C92D7'); return; }
    applyParsed(p);
  });
  $('btnBind').addEventListener('click', doBind);

  $('vToken').textContent = findToken() ? '已获取' : '未登录（请先在 App 里登录）';
  $('vBridge').textContent = hasBridge() ? '可用（LobsterAndroid.lanHttp）' : '不可用（浏览器/未更新 App）';
})();
</script>
</body>
</html>
