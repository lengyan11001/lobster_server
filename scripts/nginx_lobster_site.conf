# 生产 /etc/nginx/sites-enabled/lobster 的副本（2026-10-11 改动后）
# 本次改动：
#   1) 删掉 location ~* ^/h5-static/.*\.(js|css)$ —— 它把 app 自带的缓存头覆盖成 no-cache 且没有 gzip；
#      现在 /h5-static/*.js|css 走 location /，由 app 决定缓存头（带 ?v= 的长缓存）+ nginx gzip。
#   2) h5.bhzn.top 的 listen 443 ssl → listen 443 ssl http2。
#   3) sites-enabled 里重复声明 h5.bhzn.top 的旧备份已移到 sites-available/archived/。
# 效果：h5-app.js 1.63MB → 377KB(gzip)，首页 168KB → 35KB。

server {
    listen 80;
    server_name bhzn.top www.bhzn.top h5.bhzn.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bhzn.top www.bhzn.top;

    ssl_certificate /etc/letsencrypt/live/bhzn.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhzn.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;


    location /api/h5-chat/voice/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /canvas-web/ {
        alias /opt/lobster-server/canvas_web_dist/;
        gzip on;
        gzip_min_length 512;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        gzip on;
        gzip_proxied any;
        gzip_min_length 512;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name h5.bhzn.top;

    ssl_certificate /etc/letsencrypt/live/bhzn.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhzn.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200M;

    location /api/h5-chat/voice/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }


location / {
        gzip on;
        gzip_proxied any;
        gzip_min_length 512;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
    }
}