<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MANAGE · 项目管理与 AI 赋能</title>
<style>
:root{
  --bg:#05070f; --ink:#eaf1fb; --muted:#93a1b8; --dim:#5c6a80;
  --w-glass:rgba(255,255,255,.045); --w-line:rgba(255,255,255,.10); --w-line2:rgba(255,255,255,.22);
  --accent:#22d3ee;                    /* 全场唯一强调色 */
  --ease:cubic-bezier(.22,1,.36,1);
  --slow:26s; --slower:34s;
  --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:400 15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
/* ---------- 全屏视频 + 极光 ---------- */
.stage{position:relative;min-height:100dvh;overflow:hidden}
.bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.85;transform:scale(1.06);filter:saturate(1.05) contrast(1.03)}
.bgstack{position:absolute;inset:0}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity 3.4s var(--ease);
  animation:imgDrift var(--slower) var(--ease) infinite alternate}
.bgimg.on{opacity:.92}
@keyframes imgDrift{from{transform:scale(1.05) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.4%,-1%,0)}}
.veil{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 120%,rgba(5,7,15,.98) 0%,rgba(5,7,15,.75) 42%,transparent 72%),
  radial-gradient(90% 70% at 50% -20%,rgba(5,7,15,.9) 0%,transparent 60%),
  linear-gradient(180deg,rgba(5,7,15,.55),rgba(5,7,15,.2) 40%,rgba(5,7,15,.92))}
.aurora{position:absolute;border-radius:50%;filter:blur(110px);mix-blend-mode:screen;opacity:.5}
.a1{width:70vw;height:70vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(34,211,238,.55),transparent 60%);
  animation:drift1 var(--slow) var(--ease) infinite alternate}
.a2{width:60vw;height:60vw;right:-14vw;top:-10vw;background:radial-gradient(circle,rgba(99,102,241,.5),transparent 60%);
  animation:drift2 var(--slow) var(--ease) infinite alternate;animation-delay:-8s}
.a3{width:80vw;height:60vw;left:18vw;bottom:-30vw;background:radial-gradient(circle,rgba(168,85,247,.34),transparent 62%);
  animation:drift1 var(--slower) var(--ease) infinite alternate-reverse}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,2vw,0) scale(1.16)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-5vw,3vw,0) scale(1)}}
.grid{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(100% 70% at 50% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(100% 70% at 50% 0%,#000 0%,transparent 72%)}
#stars{position:absolute;inset:0;opacity:.75}
/* ---------- 内容 ---------- */
.wrap{position:relative;z-index:5;min-height:100dvh;display:flex;flex-direction:column;padding:0 6vw 42px}
nav{display:flex;align-items:center;gap:14px;height:68px;margin-top:14px;padding:0 16px;border-radius:16px;
  background:var(--w-glass);border:1px solid var(--w-line);backdrop-filter:blur(20px);
  animation:rise 1.1s var(--ease) both .1s}
nav .logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:700 12px var(--mono);color:#06121c;
  background:conic-gradient(from 130deg,#22d3ee,#6366f1,#a855f7,#22d3ee);box-shadow:0 0 22px rgba(34,211,238,.45)}
nav .nm{font-size:14px;font-weight:600;letter-spacing:.14em}
nav a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .5s var(--ease)}
nav a:hover{color:var(--ink)}
nav .grow{flex:1}
nav .cta{height:34px;padding:0 15px;border-radius:10px;border:0;cursor:pointer;font-size:13px;font-weight:600;color:#04121a;
  background:linear-gradient(100deg,#67e8f9,#a5f4fb)}
.hero{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vw;align-items:center;padding:6vh 0 2vh}
.left .eyebrow{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;
  border:1px solid var(--w-line);background:var(--w-glass);color:var(--muted);font-size:12px;letter-spacing:.06em;
  animation:rise 1.1s var(--ease) both .18s}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
h1{margin:22px 0 0;font-size:clamp(34px,4.4vw,62px);line-height:1.08;font-weight:650;letter-spacing:-.02em;
  animation:rise 1.3s var(--ease) both .28s}
h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 34px rgba(34,211,238,.55)}
.sub{margin:20px 0 0;max-width:44ch;color:var(--muted);font-size:16px;line-height:1.8;
  animation:rise 1.3s var(--ease) both .42s}
.btns{display:flex;gap:12px;margin-top:32px;animation:rise 1.3s var(--ease) both .56s}
.btns button{height:50px;padding:0 26px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .6s var(--ease),box-shadow .6s var(--ease),border-color .6s var(--ease)}
.btns .primary{border:0;color:#04121a;background:linear-gradient(100deg,#67e8f9,#818cf8 60%,#c084fc);
  box-shadow:0 18px 44px -18px rgba(34,211,238,.9)}
.btns .primary:hover{transform:translateY(-2px);box-shadow:0 24px 56px -18px rgba(34,211,238,1)}
.btns .ghost{border:1px solid var(--w-line2);background:transparent;color:var(--ink)}
.btns .ghost:hover{border-color:var(--accent);color:#a5f4fb}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
/* ---------- 假窗口（放真截图） ---------- */
.window{position:relative;transform-style:preserve-3d;
  animation:rise 1.5s var(--ease) both .5s, floatY 18s ease-in-out infinite 2s}
@keyframes floatY{0%,100%{transform:translateY(0) rotateX(2deg) rotateY(-6deg)}50%{transform:translateY(-14px) rotateX(1deg) rotateY(-4deg)}}
.frame{border-radius:16px;overflow:hidden;background:rgba(10,14,26,.72);
  border:1px solid var(--w-line);backdrop-filter:blur(18px);
  box-shadow:0 50px 120px -40px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.05) inset}
.bar{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-bottom:1px solid var(--w-line);
  background:rgba(255,255,255,.03)}
.bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);display:block}
.bar .url{margin-left:8px;flex:1;height:20px;border-radius:6px;background:rgba(255,255,255,.05);
  font:500 11px var(--mono);color:var(--dim);display:flex;align-items:center;padding:0 9px}
.frame img{display:block;width:100%;height:auto}
.chip{position:absolute;display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:14px;
  background:rgba(10,14,26,.66);border:1px solid var(--w-line);backdrop-filter:blur(18px);
  box-shadow:0 24px 60px -30px rgba(0,0,0,.95);font-size:12.5px;white-space:nowrap}
.chip .t{color:var(--muted);font-size:11px}
.chip .v{font-family:var(--mono);font-size:13px;color:var(--ink)}
.c1{left:-4%;bottom:12%;animation:rise 1.4s var(--ease) both .9s, floatC 22s ease-in-out infinite 2s}
.c2{right:3%;top:-5%;animation:rise 1.4s var(--ease) both 1.05s, floatC 26s ease-in-out infinite 3s}
@keyframes floatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.scroll{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:var(--dim);font-size:11.5px;
  display:flex;flex-direction:column;align-items:center;gap:7px;animation:rise 1.2s var(--ease) both 1.3s}
.scroll .ln{width:1px;height:34px;background:linear-gradient(var(--accent),transparent);animation:pl 3.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:34px;padding-top:2vh}
  .window{animation:rise 1.4s var(--ease) both .5s}
  .c1{left:0;bottom:-8%}.c2{right:0;top:-6%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<section class="stage" id="stage">
  <video class="bgvideo" id="bgv" autoplay muted loop playsinline preload="auto"
         poster="assets/hero_1536x1024.png">
    <source src="assets/hero-loop.mp4" type="video/mp4" />
  </video>
  <div class="bgstack" id="bgstack">
    <img class="bgimg on" src="assets/hero_1536x1024.png" alt="" />
    <img class="bgimg" src="assets/hero_default.png" alt="" />
    <img class="bgimg" src="assets/hero_1024x1024.png" alt="" />
  </div>
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <canvas id="stars"></canvas>
  <div class="grid"></div>
  <div class="veil"></div>

  <div class="wrap">
    <nav>
      <span class="logo">M</span><span class="nm">MANAGE</span>
      <a href="#" style="margin-left:18px">简报</a>
      <a href="#">项目</a>
      <a href="#">达成条件</a>
      <a href="#">财务</a>
      <span class="grow"></span>
      <button class="cta">进入工作台</button>
    </nav>

    <div class="hero">
      <div class="left">
        <span class="eyebrow"><span class="dot"></span>AI 每天 09:00 / 17:00 自动体检项目</span>
        <h1>让每个项目<br /><em>真的做成</em></h1>
        <p class="sub">老板只输入目标，AI 排出阶段、任务、责任人、要求与时间节点；
        判断资源不够时，它会主动告诉你该招谁、该加什么。</p>
        <div class="btns">
          <button class="primary">进入工作台</button>
          <button class="ghost">看一次规划演示</button>
        </div>
      </div>

      <div class="right" id="right">
        <div class="window" id="win">
          <div class="frame">
            <div class="bar"><i></i><i></i><i></i><span class="url">manage.bhzn.top</span></div>
            <img src="assets/shot-dashboard.png" alt="manage 工作台" />
          </div>
          <div class="chip c1"><span class="dot"></span><span><span class="t">AI 日检</span><br /><span class="v">09:00 · 17:00</span></span></div>
          <div class="chip c2"><span class="dot"></span><span><span class="t">达成条件</span><br /><span class="v">3 项待补位</span></span></div>
        </div>
      </div>
    </div>

    <div class="scroll"><span>向下了解</span><span class="ln"></span></div>
  </div>
</section>

<script>
(function(){
  "use strict";
  // 视频可用则显示（失败自动退回静帧，不做静默降级之外的复杂逻辑）
  var v = document.getElementById("bgv");
  var stack = document.getElementById("bgstack");
  var frames = Array.prototype.slice.call(stack.querySelectorAll(".bgimg"));
  var mi = 0, timer = null;
  function carousel(){
    timer = setInterval(function(){
      frames[mi].classList.remove("on");
      mi = (mi + 1) % frames.length;
      frames[mi].classList.add("on");
    }, 12000);
  }
  function ok(){ stack.style.display = "none"; v.style.display = "block"; if (timer) clearInterval(timer); v.play().catch(function(){}); }
  function no(){ v.style.display = "none"; stack.style.display = "block"; carousel(); }
  v.addEventListener("loadeddata", function(){ if (v.videoWidth) ok(); else no(); }, { once:true });
  v.addEventListener("error", no, { once:true });
  setTimeout(function(){ if (!v.videoWidth) no(); }, 2500);

  // 极慢星点漂移
  var c = document.getElementById("stars"), x = c.getContext("2d"), ps = [], R = Math.min(2, devicePixelRatio||1), W=0, H=0;
  function size(){
    W = c.width = innerWidth*R; H = c.height = innerHeight*R;
    c.style.width = innerWidth+"px"; c.style.height = innerHeight+"px";
    ps = [];
    for (var n=0;n<Math.round(innerWidth*innerHeight/16000);n++){
      ps.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,a:Math.random()*6.28});
    }
  }
  var t0 = performance.now();
  function tick(now){
    var t = (now - t0)/1000;
    x.clearRect(0,0,W,H);
    for (var k=0;k<ps.length;k++){
      var p = ps[k];
      var yy = (p.y + Math.sin(t*0.06 + p.a)*3*R) % H;
      var xx = (p.x + Math.cos(t*0.04 + p.a)*3*R) % W;
      var tw = .35 + .65*Math.abs(Math.sin(t*0.22 + p.a));
      x.beginPath(); x.arc(xx, yy, p.z*1.25*R, 0, 6.283);
      x.fillStyle = "rgba(200,235,255," + (p.z*tw*.85) + ")"; x.fill();
    }
    requestAnimationFrame(tick);
  }
  size(); requestAnimationFrame(tick); addEventListener("resize", size);

  // 指针参与（缓慢跟随，不抢焦点）
  var right = document.getElementById("right"), win = document.getElementById("win");
  var tx=0, ty=0, cx=0, cy=0;
  addEventListener("pointermove", function(e){
    tx = (e.clientX/innerWidth - .5) * 26;
    ty = (e.clientY/innerHeight - .5) * 18;
  });
  (function lerp(){
    cx += (tx-cx)*0.035; cy += (ty-cy)*0.035;
    win.style.setProperty("--px", cx.toFixed(2)+"px");
    win.style.setProperty("--py", cy.toFixed(2)+"px");
    win.style.marginLeft = (cx*0.5).toFixed(2)+"px";
    win.style.marginTop  = (cy*0.5).toFixed(2)+"px";
    requestAnimationFrame(lerp);
  })();
})();
</script>
</body>
</html>
