<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商家后台 · shopcms.bhzn.top</title>
<style>
:root{--bg:#0f1115;--card:#161a21;--ink:#e8eaee;--dim:#9aa3b0;--line:rgba(255,255,255,.10);--brand:#2f7d46;--warn:#e0a84a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.top{position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.top .bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.brand{font-weight:650;letter-spacing:2px}.brand small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:1px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 0}
.tab{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
main{padding:22px 0 60px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px}
.kpi b{display:block;font-size:22px;margin-top:6px}
.kpi span{color:var(--dim);font-size:12px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-size:15px;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:middle}
th{color:var(--dim);font-weight:400}
input,select,textarea{background:#0c0e12;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;width:100%}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{background:var(--brand);border:0;color:#fff;border-radius:999px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.mini{padding:5px 12px;font-size:12px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.muted{color:var(--dim)}.ok{color:#4cc38a}.err{color:#ff6b6b}
.login{max-width:400px;margin:9vh auto;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:28px}
.login h1{margin:0 0 6px;font-size:20px;letter-spacing:1px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim)}
.tag.on{border-color:var(--brand);color:#7fd8a2}
.hint{font-size:12px;color:var(--dim);margin-top:10px}
.hint a{color:#7fd8a2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint.err{color:#ff6b6b}
.upload{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;background:#0c0e12}
.upload input[type=file]{border:0;padding:0;background:transparent;color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:110px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#0c0e12}
.thumb img{width:100%;height:86px;object-fit:cover;border-radius:8px;display:block}
.thumb .btn{width:100%;margin-top:6px}
.spec-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:8px;align-items:center}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-mask{position:absolute;inset:0;background:rgba(6,8,12,.66)}
.modal-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;width:min(94vw,620px);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-card.wide{width:min(96vw,980px)}
.modal-card h3{margin:0 0 12px;font-size:16px;letter-spacing:1px}
.mhint{font-size:12.5px;color:var(--dim,#6b7280);background:rgba(91,124,255,.06);border:1px solid rgba(91,124,255,.18);border-radius:10px;padding:6px 9px;margin:0 0 10px}
.modal-x{position:absolute;top:8px;right:14px;border:0;background:none;color:var(--dim);font-size:22px;line-height:1;cursor:pointer}
.mtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.mtab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.mtab.on{color:var(--ink);border-bottom-color:var(--brand)}
.mfoot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;flex-wrap:wrap}
.pickbar{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.thumb{position:relative;width:118px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#0c0e12}
.thumb img{width:100%;height:92px;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in}
.thumb-acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.thumb-acts .btn{flex:1;padding:3px 6px;font-size:11px}
.thumb.pk{cursor:pointer}
.thumb.pk.on{border-color:var(--brand)}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;margin-top:8px}
.pv-overlay{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}
.pv-overlay img{max-width:92vw;max-height:84vh;border-radius:10px}
.pv-tip{color:#cbd3e1;font-size:12px;margin-top:10px}
.pv-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;margin-top:8px}
.pv-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0c0e12}
.pv-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.pv-ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.pv-body{padding:12px 14px}
.pv-name{font-weight:600}
.pv-sub{color:var(--dim);font-size:12px;margin-top:4px}
.pv-price{color:#7fd8a2;font-weight:700;margin-top:8px}
.pv-price.big{font-size:22px;margin-top:6px}
.pv-comm{color:var(--dim);font-size:12px;margin-top:4px}
.pv-detail{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pv-detail-title{font-size:18px;font-weight:600}
.pv-detail-sub{color:var(--dim);font-size:13px;margin-top:4px}
@media(max-width:860px){.pv-grid{grid-template-columns:1fr}}</style>
</head><body>
<div class="top"><div class="wrap bar">
  <div class="brand">商家后台<small>shopcms.bhzn.top</small></div>
  <div id="who" class="muted"></div>
</div></div>
<div class="wrap"><main id="app"></main></div>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'shopcms_token_v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function yuan(c) { var v = Number(c || 0) / 100; return '¥' + (v % 1 === 0 ? v : v.toFixed(2)); }
  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function jfetch(path, opts) {
    var init = opts || {};
    init.headers = { 'Content-Type': 'application/json' };
    if (token()) init.headers.Authorization = 'Bearer ' + token();
    return fetch(path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { setToken(''); state.authNotice = '登录已过期，请重新登录'; render(); throw new Error(state.authNotice); }
        if (r.status === 403) {
          var raw = (d && (d.detail || d.message)) || '';
          var text = typeof raw === 'string' ? raw : ((raw && raw[0] && raw[0].msg) || '无权访问该接口');
          if (/停用|驳回|未通过/.test(text)) {
            setToken(''); state.me = null; state.products = []; state.orders = []; state.authNotice = text; render();
          }
          throw new Error(text);
        }
        if (!r.ok || d.ok === false) {
          var m = (d && (d.detail || d.message)) || ('HTTP ' + r.status);
          throw new Error(typeof m === 'string' ? m : JSON.stringify(m));
        }
        return d;
      });
    });
  }
  var state = { submissions: [], subProduct: 0, subStatus: '', subKeyword: '', subSyncListing: false, view: 'overview',
    products: [], orders: [], me: null, summary: {}, msg: '',
    draft: null, picker: null, preview: null, acceptedItems: [],
    authMode: 'login', authNotice: '' };

  function loginView() {
    if (state.authMode === 'register') {
      return [
        '<div class="login">',
        '<h1>开店入驻</h1><div class="muted">手机号 + 密码就能开店，注册后可直接上传商品</div>',
        '<label for="r-name">店铺 / 公司名称 *</label><input id="r-name" placeholder="如 天水花牛果专营店">',
        '<div class="row2">',
        '<div><label for="r-type">类型</label><select id="r-type"><option value="company">企业</option><option value="individual">个体 / 个人</option></select></div>',
        '<div><label for="r-region">地区</label><input id="r-region" placeholder="省市 / 区县"></div>',
        '</div>',
        '<div class="row2">',
        '<div><label for="r-contact">联系人</label><input id="r-contact" placeholder="姓名"></div>',
        '<div><label for="r-phone">手机号 *</label><input id="r-phone" autocomplete="username" placeholder="登录用手机号"></div>',
        '</div>',
        '<label for="r-pwd">登录密码 *</label><input id="r-pwd" type="password" autocomplete="new-password" placeholder="至少 6 位">',
        '<div style="margin-top:16px"><button class="btn" id="do-register" type="button" style="width:100%">开店入驻</button></div>',
        '<div class="hint' + (state.authNotice ? ' err' : '') + '" id="login-tip">' + (state.authNotice ? esc(state.authNotice) : '提交后立即开通（状态先为待审核，不影响你建商品、上架）。已经有店铺？<a href="javascript:void(0)" id="go-login">去登录</a>') + '</div>',
        '</div>'
      ].join('');
    }
    return [
      '<div class="login">',
      '<h1>商家后台登录</h1><div class="muted">用开店时的手机号 + 密码登录</div>',
      '<label for="acct">手机号 / 邮箱</label><input id="acct" autocomplete="username" placeholder="如 17000000000">',
      '<label for="pwd">密码</label><input id="pwd" type="password" autocomplete="current-password" placeholder="登录密码">',
      '<div style="margin-top:16px"><button class="btn" id="do-login" type="button" style="width:100%">登录</button></div>',
      '<div class="hint' + (state.authNotice ? ' err' : '') + '" id="login-tip">' + (state.authNotice ? esc(state.authNotice) : '还没有店铺？<a href="javascript:void(0)" id="go-register">立即开店入驻</a>（手机号 + 密码即可）') + '</div>',
      '</div>'
    ].join('');
  }

  function overviewView() {
    var m = state.me || {};
    var c = state.summary || {};
    var onSale = state.products.filter(function (p) { return p.status === 'on_sale'; }).length;
    return [
      '<div class="grid">',
      '<div class="kpi"><span>店铺</span><b>' + esc(m.company_name || '-') + '</b><span>slug: ' + esc(m.slug || '-') + ' · ' + esc(m.status || '') + '</span></div>',
      '<div class="kpi"><span>商品（在售/全部）</span><b>' + onSale + ' / ' + state.products.length + '</b><span>库存合计 ' + state.products.reduce(function (s, p) { return s + Number(p.stock || 0); }, 0) + '</span></div>',
      '<div class="kpi"><span>订单</span><b>' + state.orders.length + '</b><span>实付合计 ' + yuan(state.orders.reduce(function (s, o) { return s + Number(o.pay_amount_cents || 0); }, 0)) + '</span></div>',
      '<div class="kpi"><span>待结佣金</span><b>' + yuan(c.pending || 0) + '</b><span>已结 ' + yuan(c.settled || 0) + ' · 作废 ' + yuan(c.invalid || 0) + '</span></div>',
      '</div>',
      '<div class="panel"><h3>店铺信息</h3>',
      '<div class="muted">独立站：<a href="https://shop.bhzn.top/?slug=' + encodeURIComponent(m.slug || '') + '" target="_blank">https://shop.bhzn.top/?slug=' + esc(m.slug || '') + '</a></div>',
      '<div class="muted">佣金按商品设置（在「商品」里给每个商品填佣金%）· 平台抽成 ' + (Number(m.platform_fee_bp || 0) / 100) + '% · 归因窗口 ' + Number(m.attribution_days || 0) + ' 天</div>',
      '<div class="muted">主题：' + esc((m.theme || {}).preset || '（按类目自动）') + '</div>',
      '</div>',
      '<div class="panel"><h3>最近订单</h3>' + ordersTable(state.orders.slice(0, 5)) + '</div>'
    ].join('');
  }

  function statusTag(s) {
    var on = s === 'on_sale';
    return '<span class="tag' + (on ? ' on' : '') + '">' + esc(on ? '在售' : (s === 'off_shelf' ? '已下架' : s || '-')) + '</span>';
  }

  function productsQueryUrl() {
    var kw = String(state.productKeyword || '').trim();
    var st = String(state.productStatus || '').trim();
    return '/api/shop-cms/products?size=100' +
      (kw ? '&keyword=' + encodeURIComponent(kw) : '') +
      (st ? '&status=' + encodeURIComponent(st) : '');
  }

  function loadProducts() {
    return jfetch(productsQueryUrl())
      .then(function (d) {
        state.products = d.items || [];
        state.productTotal = Number(d.total || state.products.length);
      })
      .then(render)
      .catch(function (e) { state.msg = '商品加载失败：' + e.message; render(); });
  }

  function productsFilterBar() {
    var options = [['', '全部状态'], ['on_sale', '在售'], ['draft', '草稿'], ['off_shelf', '已下架'], ['reviewing', '待审核']]
      .map(function (it) {
        return '<option value="' + it[0] + '"' + ((String(state.productStatus || '') === it[0]) ? ' selected' : '') + '>' + it[1] + '</option>';
      }).join('');
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 4px">' +
      '<input id="prod-keyword" placeholder="搜商品名 / SPU / 关键词（回车搜索）" value="' + esc(state.productKeyword || '') + '" style="min-width:260px">' +
      '<select id="prod-status">' + options + '</select>' +
      '<button class="btn mini" id="prod-search" type="button">搜索</button>' +
      '<button class="btn mini ghost" id="prod-reset" type="button">重置</button>' +
      '<span class="muted">共 ' + Number(state.productTotal || state.products.length || 0) + ' 个商品</span>' +
      '</div>' +
      '<div class="hint">上架到独立站 = 买家能下单、能生成推广链接；给 online 赚钱用 = 商品资料完善即可（图片工作台/投稿可选用它的素材）。</div>';
  }

  function statusOptions(cur) {
    return [['draft', '草稿'], ['on_sale', '直接上架'], ['off_shelf', '下架']].map(function (it) {
      return '<option value="' + it[0] + '"' + (cur === it[0] ? ' selected' : '') + '>' + it[1] + '</option>';
    }).join('');
  }

  // ── 商品：列表 + 弹窗（①商品资料 / ②独立站上架素材 / ③上架效果预览）─────────────

  function newDraft() {
    return {
      id: 0, title: '', subtitle: '', category: '', brand: '', price: '', market: '', stock: '0', bp: '10',
      tags: '', keywords: '', status: 'draft', detailText: '',
      specs: [{ k: '', v: '' }],
      sku: [{ n: '', p: '', s: '' }], promises: ['7天无理由'], shipping: '', shipDays: '', seoTitle: '', seoDesc: '', slug: '',
      gallery: [], detail: [],
      cover: '', listingGallery: [], listingDetail: [], listingTouched: false,
      tab: 'info'
    };
  }

  function draftFromProduct(p) {
    var d = newDraft();
    d.id = p.id;
    d.title = p.title || ''; d.subtitle = p.subtitle || ''; d.category = p.category || ''; d.brand = p.brand || '';
    d.price = String(Number(p.price_cents || 0) / 100);
    d.market = String(Number(p.market_price_cents || 0) / 100);
    d.stock = String(Number(p.stock || 0));
    d.bp = String(Number(p.commission_bp_own || p.commission_bp || 0) / 100);
    d.tags = (p.tags || []).join ? (p.tags || []).join(',') : (p.tags || '');
    d.keywords = p.keywords || ''; d.status = p.status || 'draft'; d.detailText = p.detail_text || '';
    var keys = Object.keys(p.specs || {});
    d.specs = keys.length ? keys.map(function (k) { return { k: k, v: p.specs[k] }; }) : [{ k: '', v: '' }];
    var tb = (p.specs && p.specs._taobao) || {};
    d.sku = Array.isArray(tb.sku) && tb.sku.length ? tb.sku.map(function (r) { return { n: r.n || '', p: r.p || '', s: r.s || '' }; }) : [{ n: '', p: '', s: '' }];
    d.promises = Array.isArray(tb.promises) ? tb.promises.slice() : ['7天无理由'];
    d.shipping = tb.shipping || ''; d.shipDays = tb.shipDays || '';
    d.seoTitle = tb.seoTitle || ''; d.seoDesc = tb.seoDesc || ''; d.slug = tb.slug || '';
    d.gallery = (p.gallery || []).slice();
    d.detail = (p.detail_images || []).slice();
    var listing = p.listing || {};
    d.cover = String(listing.cover || '');
    d.listingGallery = (listing.gallery || []).slice();
    d.listingDetail = (listing.detail_images || []).slice();
    d.listingTouched = !!(listing.from_listing && (d.cover || d.listingGallery.length || d.listingDetail.length));
    return d;
  }

  function openProduct(p) {
    state.draft = p ? draftFromProduct(p) : newDraft();
    state.picker = null; state.preview = null; state.msg = '';
    render();
    if (state.draft.id) loadAcceptedForDraft(state.draft.id);
  }

  function closeProduct() {
    state.draft = null; state.picker = null; state.preview = null; render();
  }

  function captureDraft() {
    var d = state.draft;
    if (!d) return;
    function v(id) { var el = document.getElementById(id); return el ? el.value : null; }
    var x;
    if ((x = v('f-title')) !== null) d.title = x;
    if ((x = v('f-subtitle')) !== null) d.subtitle = x;
    if ((x = v('f-category')) !== null) d.category = x;
    if ((x = v('f-brand')) !== null) d.brand = x;
    if ((x = v('f-price')) !== null) d.price = x;
    if ((x = v('f-market')) !== null) d.market = x;
    if ((x = v('f-stock')) !== null) d.stock = x;
    if ((x = v('f-bp')) !== null) d.bp = x;
    if ((x = v('f-tags')) !== null) d.tags = x;
    if ((x = v('f-keywords')) !== null) d.keywords = x;
    if ((x = v('f-status')) !== null) d.status = x;
    if ((x = v('f-detail-text')) !== null) d.detailText = x;
    if ((x = v('f-slug')) !== null) d.slug = x;
    if ((x = v('f-ship-days')) !== null) d.shipDays = x;
    if ((x = v('f-seo-title')) !== null) d.seoTitle = x;
    if ((x = v('f-seo-desc')) !== null) d.seoDesc = x;
    if ((x = v('f-shipping')) !== null) d.shipping = x;
    var skuRows = document.querySelectorAll('#f-sku-rows [data-sku-row]');
    if (skuRows.length) {
      d.sku = Array.prototype.map.call(skuRows, function (r) {
        var n = r.querySelector('.sku-n'), p2 = r.querySelector('.sku-p'), s2 = r.querySelector('.sku-s');
        return { n: n ? n.value : '', p: p2 ? p2.value : '', s: s2 ? s2.value : '' };
      });
    }
    var promiseBoxes = document.querySelectorAll('.f-promise');
    if (promiseBoxes.length) {
      d.promises = Array.prototype.filter.call(promiseBoxes, function (b) { return b.checked; }).map(function (b) { return b.value; });
    }
    var rows = document.querySelectorAll('#f-spec-rows [data-spec-row]');
    if (rows.length) {
      d.specs = Array.prototype.map.call(rows, function (r) {
        var k = r.querySelector('.spec-k'), vv = r.querySelector('.spec-v');
        return { k: k ? k.value : '', v: vv ? vv.value : '' };
      });
    }
  }

  function listOf(target) {
    var d = state.draft;
    if (!d) return null;
    if (target === 'gallery') return d.gallery;
    if (target === 'detail') return d.detail;
    if (target === 'listingGallery') return d.listingGallery;
    if (target === 'listingDetail') return d.listingDetail;
    return null;
  }

  var PROMISES = ['7天无理由', '正品保证', '极速发货', '支持退换货'];
  function skuRowsHtml(rows) {

  function loadAcceptedForDraft(productId) {
    return jfetch('/api/shop-cms/submissions?size=100&status=used&product_id=' + Number(productId || 0))
      .then(function (d) { state.acceptedItems = (d.items || []).filter(function (it) { return String(it.url || '').trim(); }); })
      .catch(function () { state.acceptedItems = []; })
      .then(function () {
        if (state.picker) { state.picker.items = (state.acceptedItems || []).slice(); state.picker.loading = false; }
        render();
      });

  function loadMerchantUploadsForPicker() {
    jfetch('/api/shop-cms/uploads').then(function (d) {
      var items = (d && d.items) || [];
      if (state.picker) { state.picker.items = items; state.picker.loading = false; }
      render();
    }).catch(function (e) {
      if (state.picker) { state.picker.items = []; state.picker.loading = false; }
      state.msg = '读取已上传图片失败：' + e.message;
      render();
    });

  function openPicker(target) {
    captureDraft();
    var d = state.draft;
    var pk = { target: target, tab: 'local', items: [], picked: [], loading: false };
    if (target === 'listingCover') pk.picked = d.cover ? [d.cover] : [];
    else { var list = listOf(target) || []; pk.picked = list.slice(); }
    state.picker = pk;
    state.preview = null;
    render();
    pk.loading = true; loadMerchantUploadsForPicker();

  function togglePick(url) {
    var pk = state.picker;
    if (!pk) return;
    if (pk.target === 'listingCover') { pk.picked = pk.picked[0] === url ? [] : [url]; render(); return; }
    var i = pk.picked.indexOf(url);
    if (i >= 0) pk.picked.splice(i, 1); else pk.picked.push(url);
    render();
  }

  function applyPickedIntoDraft(url) {
    var pk = state.picker, d = state.draft;
    if (!pk || !d || !url) return;
    if (pk.target === 'listingCover') { d.cover = url; d.listingTouched = true; return; }
    var list = listOf(pk.target);
    if (!list) return;
    if (list.indexOf(url) < 0) list.push(url);
    if (pk.target === 'listingGallery' || pk.target === 'listingDetail') d.listingTouched = true;
  }

  function pickerConfirm() {
    var pk = state.picker, d = state.draft;
    if (!pk || !d) return;
    if (pk.target === 'listingCover') {
      d.cover = pk.picked[0] || '';
      d.listingTouched = true;
    } else {
      var list = listOf(pk.target);
      list.length = 0;
      pk.picked.forEach(function (u) { if (u && list.indexOf(u) < 0) list.push(u); });
      if (pk.target === 'listingGallery' || pk.target === 'listingDetail') d.listingTouched = true;
    }
    state.picker = null;
    render();
  }

  function pickerUpload(input) {
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var tip = $('#pk-tip');
    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        return uploadImage(f, tip).then(function (d) {
          if (state.picker && state.picker.picked.indexOf(d.url) < 0) state.picker.picked.push(d.url);
          applyPickedIntoDraft(d && d.url);
        });
      });
    });
    chain.then(function () {
      state.msg = '已上传 ' + files.length + ' 张，点「确定加入」写入';
      render();
    }).catch(function (e) { state.msg = '上传失败：' + e.message; render(); });
  }

    var specs = {};

      sku: (d.sku || []).map(function (r) {

      promises: d.promises || [],

      slug: String(d.slug || '').trim()
    };
    (d.specs || []).forEach(function (r) {
      var k = String(r.k || '').trim();
      if (k) specs[k] = String(r.v || '').trim();

    var payload = {
      title: String(d.title).trim(),
      subtitle: String(d.subtitle || '').trim(),
      category: String(d.category || '').trim(),
      brand: String(d.brand || '').trim(),
      keywords: String(d.keywords || '').trim(),
      price_cents: Math.round(Number(d.price || 0) * 100),
      market_price_cents: Math.round(Number(d.market || 0) * 100),
      stock: parseInt(d.stock || '0', 10) || 0,
      commission_bp: Math.round(Number(d.bp || 0) * 100),
      commission_type: 'percent',
      tags: String(d.tags || '').trim(),
      cover_url: d.gallery[0],
      gallery: d.gallery.slice(),
      detail_images: d.detail.slice(),
      detail_text: d.detailText || '',
      specs: specs,
      status: d.status
    };
    var btn = $('#save-product');
    if (btn) btn.disabled = true;
    var isNew = !d.id;
    jfetch(isNew ? '/api/shop-cms/products' : ('/api/shop-cms/products/' + d.id),
      { method: isNew ? 'POST' : 'PUT', body: JSON.stringify(payload) })
      .then(function (r) {
        var pid = (r.product && r.product.id) || d.id;
        d.id = pid;
        state.msg = '已保存商品 #' + pid;
        var needListing = !!(d.listingTouched || d.cover || d.listingGallery.length || d.listingDetail.length);
        if (needListing) {
          return jfetch('/api/shop-cms/products/' + pid + '/listing', {
            method: 'POST',
            body: JSON.stringify({
              cover: d.cover || d.listingGallery[0] || '',
              gallery: d.listingGallery.slice(),
              detail_images: d.listingDetail.slice(),
              from_source: false
            })
          }).then(function () { state.msg = '已保存商品 #' + pid + '（含独立站上架素材）'; });
        }
      })
      .then(function () {
        if (payload.status === 'on_sale' && d.id) {
          return jfetch('/api/shop-cms/products/' + d.id + '/publish?on=true', { method: 'POST' });
        }
      })
      .then(function () {
        state.draft = null; state.picker = null; state.preview = null;
        return loadProducts();
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        state.msg = '保存失败：' + e.message;
        render();
      });
  }
  function bindProducts() {
    var np = $('#new-product');
    if (np) np.addEventListener('click', function () { openProduct(null); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-edit'));
        var found = state.products.filter(function (p) { return p.id === id; })[0] || null;
        if (found) openProduct(found);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-toggle')), on = b.getAttribute('data-on') === '1';
        b.disabled = true;
        jfetch('/api/shop-cms/products/' + id + '/publish?on=' + (on ? 'true' : 'false'), { method: 'POST' })
          .then(function () { state.msg = '商品 #' + id + (on ? ' 已上架' : ' 已下架'); return loadProducts(); })
          .catch(function (e) { b.disabled = false; state.msg = '操作失败：' + e.message; render(); });
      });
    });

    var pm = $('#pm');
    if (pm) {
      pm.addEventListener('input', captureDraft);
      pm.addEventListener('change', captureDraft);
      Array.prototype.forEach.call(pm.querySelectorAll('[data-close-product]'), function (b) {
        b.addEventListener('click', function () { closeProduct(); });
      });
      Array.prototype.forEach.call(pm.querySelectorAll('[data-mtab]'), function (b) {
        b.addEventListener('click', function () {
          captureDraft(); state.draft.tab = b.getAttribute('data-mtab'); render();
        });
      });
      var add = $('#f-spec-add');
      if (add) add.addEventListener('click', function () {
        captureDraft(); state.draft.specs.push({ k: '', v: '' }); render();
      });
      Array.prototype.forEach.call(pm.querySelectorAll('[data-spec-del]'), function (b) {
        b.addEventListener('click', function () {
          var row = b.closest('[data-spec-row]');
          var rows = Array.prototype.slice.call(pm.querySelectorAll('#f-spec-rows [data-spec-row]'));
          var idx = rows.indexOf(row);
          captureDraft();
          if (idx >= 0) {
            state.draft.specs.splice(idx, 1);
            if (!state.draft.specs.length) state.draft.specs = [{ k: '', v: '' }];
          }
          render();
        });
      });
      Array.prototype.forEach.call(pm.querySelectorAll('[data-pick]'), function (b) {
        b.addEventListener('click', function () { openPicker(b.getAttribute('data-pick')); });
      });
      Array.prototype.forEach.call(pm.querySelectorAll('[data-del]'), function (b) {
        b.addEventListener('click', function () {
          var kind = b.getAttribute('data-del');
          var idx = Number(b.getAttribute('data-idx'));
          captureDraft();
          var list = listOf(kind);
          if (!list) return;
          list.splice(idx, 1);
          if (kind === 'listingGallery' || kind === 'listingDetail') state.draft.listingTouched = true;
          render();
        });
      });
      Array.prototype.forEach.call(pm.querySelectorAll('[data-cover]'), function (b) {
        b.addEventListener('click', function () {
          var kind = b.getAttribute('data-cover');
          var idx = Number(b.getAttribute('data-idx'));
          captureDraft();
          var list = listOf(kind);
          if (!list || !list[idx]) return;
          var url = list.splice(idx, 1)[0];
          list.unshift(url);
          if (kind === 'listingGallery') state.draft.cover = url;
          render();
        });
      });
      var cc = pm.querySelector('[data-clear-cover]');
      if (cc) cc.addEventListener('click', function () {
        captureDraft(); state.draft.cover = ''; state.draft.listingTouched = true; render();
      });
      var sp = $('#save-product');
      if (sp) sp.addEventListener('click', saveProduct);
      var swBtn = $('#m-switch-mode');
      if (swBtn) swBtn.addEventListener('click', function () {
        captureDraft();
        state.draft.tab = (state.draft.tab === 'listing') ? 'info' : 'listing';
        render();
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-listing-edit]'), function (b) {
        b.addEventListener('click', function () {
          var pid = Number(b.getAttribute('data-listing-edit'));
          var prod = (state.products || []).filter(function (x) { return Number(x.id) === pid; })[0];
          if (prod) { openProduct(prod); state.draft.tab = 'listing'; render(); }
        });
      });
      var skuAdd = $('#f-sku-add');
      if (skuAdd) skuAdd.addEventListener('click', function () {
        captureDraft();
        state.draft.sku = (state.draft.sku || []).concat([{ n: '', p: '', s: '' }]);
        render();
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-sku-del]'), function (b) {
        b.addEventListener('click', function () {
          captureDraft();
          var i = Array.prototype.indexOf.call(document.querySelectorAll('#f-sku-rows [data-sku-row]'), b.parentNode);
          state.draft.sku.splice(i, 1);
          if (!state.draft.sku.length) state.draft.sku = [{ n: '', p: '', s: '' }];
          render();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-up],[data-down]'), function (b) {
        b.addEventListener('click', function () {
          captureDraft();
          var kind = b.getAttribute('data-up') || b.getAttribute('data-down');
          var i = Number(b.getAttribute('data-idx'));
          var list = listOf(kind);
          if (!list) return;
          var j = b.getAttribute('data-up') ? i - 1 : i + 1;
          if (j < 0 || j >= list.length) return;
          var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
          if (kind === 'gallery') state.draft.gallery = list;
          render();
        });
      });
      var gu = $('#f-gallery-upload');
      var gub = $('#f-gallery-upload-btn');
      if (gub) gub.addEventListener('click', function () { if (gu) gu.click(); });
      if (gu) gu.addEventListener('change', function () {
        var files = Array.prototype.slice.call(gu.files || []);
        gu.value = '';
        if (!files.length) return;
        var chain = Promise.resolve();
        files.forEach(function (f) {
          chain = chain.then(function () {
            return uploadImage(f, null).then(function (d) {
              var draft = state.draft;
              if (draft && d && d.url && draft.gallery.indexOf(d.url) < 0) draft.gallery.push(d.url);
              if (draft && !draft.cover && d && d.url) draft.cover = d.url;
            });
          });
        });
        chain.then(function () { state.msg = '已上传 ' + files.length + ' 张商品图片'; render(); })
          .catch(function (e) { state.msg = '上传失败：' + e.message; render(); });
      });
    }

    var pkEl = $('#pk');
    if (pkEl) {
      Array.prototype.forEach.call(pkEl.querySelectorAll('[data-close-picker]'), function (b) {
        b.addEventListener('click', function () { state.picker = null; render(); });
      });
      Array.prototype.forEach.call(pkEl.querySelectorAll('[data-pktab]'), function (b) {
        b.addEventListener('click', function () {
          state.picker.tab = b.getAttribute('data-pktab');
          state.picker.loading = state.picker.tab === 'accepted' && !state.picker.items.length && !!(state.draft && state.draft.id);
          render();
        });
      });
      var f = $('#pk-file');
      if (f) f.addEventListener('change', function () { pickerUpload(f); });
      Array.prototype.forEach.call(pkEl.querySelectorAll('[data-pk]'), function (b) {
        b.addEventListener('click', function () {
          var it = (state.picker.items || [])[Number(b.getAttribute('data-pk'))];
          if (!it || !it.url) return;
          togglePick(String(it.url));
        });
      });
      Array.prototype.forEach.call(pkEl.querySelectorAll('[data-pk-rm]'), function (b) {
        b.addEventListener('click', function () {
          state.picker.picked.splice(Number(b.getAttribute('data-pk-rm')), 1);
          render();
        });
      });
      var ok = $('#pk-ok');
      if (ok) ok.addEventListener('click', pickerConfirm);
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-pv]'), function (el) {
      el.addEventListener('click', function (ev) {
        var url = el.getAttribute('data-pv');
        if (!url) return;
        ev.stopPropagation();
        ev.preventDefault();
        state.preview = url;
        render();
      });
    });
    var ov = document.querySelector('[data-close-preview]');
    if (ov) ov.addEventListener('click', function () { state.preview = null; render(); });
  }

    ]).then(function (r) {
      state.me = r[0].merchant;
      state.credits = r[0].credits || 0;
      state.products = r[1].items || [];
      state.orders = r[2].items || [];
      state.summary = r[3].by_status || {};
    });
  }

  function bindLogin() {
    var toRegister = $('#go-register');
    if (toRegister) toRegister.addEventListener('click', function () { state.authMode = 'register'; state.msg = ''; state.authNotice = ''; render(); });
    var toLogin = $('#go-login');
    if (toLogin) toLogin.addEventListener('click', function () { state.authMode = 'login'; state.msg = ''; state.authNotice = ''; render(); });
    var rbtn = $('#do-register');
    if (rbtn) rbtn.addEventListener('click', function () { doRegister(rbtn); });
    var btn = $('#do-login');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var acct = $('#acct').value.trim(), pwd = $('#pwd').value;
      var tip = $('#login-tip');
      state.authNotice = '';
      if (!acct || !pwd) { tip.className = 'hint err'; tip.textContent = '请输入手机号和密码'; return; }
      btn.disabled = true; tip.className = 'hint'; tip.textContent = '登录中…';
      fetch('/auth/login-phone-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account: acct, password: pwd }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.s !== 200 || !res.d.access_token) throw new Error(res.d.detail || ('HTTP ' + res.s));
          setToken(res.d.access_token);
          return loadAll().then(function () { render(); });
        })
        .catch(function (e) { btn.disabled = false; tip.className = 'hint err'; tip.textContent = '登录失败：' + e.message; });
    });
  }

  function doRegister(btn) {
    var tip = $('#login-tip');
    var body = {
      company_name: ($('#r-name').value || '').trim(),
      company_type: ($('#r-type').value || 'company'),
      phone: ($('#r-phone').value || '').trim(),
      password: $('#r-pwd').value || '',
      contact_name: ($('#r-contact').value || '').trim(),
      region: ($('#r-region').value || '').trim()
    };
    if (!body.company_name) { tip.className = 'hint err'; tip.textContent = '请填店铺 / 公司名称'; return; }
    if (!body.phone || !body.password) { tip.className = 'hint err'; tip.textContent = '请填手机号和密码'; return; }
    if (body.password.length < 6) { tip.className = 'hint err'; tip.textContent = '密码至少 6 位'; return; }
    btn.disabled = true; tip.className = 'hint'; tip.textContent = '正在开通店铺…';
    fetch('/api/shop-cms/merchants/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (res) {
        if (res.s !== 200 && res.s !== 201) throw new Error(res.d.detail || ('HTTP ' + res.s));
        tip.textContent = '店铺已开通，正在登录…';
        return fetch('/auth/login-phone-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account: body.phone, password: body.password }) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); });
      })
      .then(function (res) {
        if (res.s !== 200 || !res.d.access_token) throw new Error('开店成功，但自动登录失败，请手动登录');
        setToken(res.d.access_token);
        state.authMode = 'login';
        return loadAll().then(function () { state.msg = '店铺已开通，先去「商品」上传你的商品吧'; state.view = 'products'; render(); });
      })
      .catch(function (e) { btn.disabled = false; tip.className = 'hint err'; tip.textContent = e.message; });
  }

  function uploadImage(file, tipEl) {
    var fd = new FormData();
    fd.append('file', file);
    var headers = {};
    if (token()) headers.Authorization = 'Bearer ' + token();
    if (tipEl) { tipEl.className = 'hint'; tipEl.textContent = '上传中：' + file.name; }
    return fetch('/api/shop-cms/uploads', { method: 'POST', headers: headers, body: fd }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || d.ok === false) throw new Error(d.detail || d.message || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function bindApp() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) {
      b.addEventListener('click', function () {
        state.view = b.getAttribute('data-view'); state.draft = null; state.picker = null; state.preview = null; state.msg = '';
        if (state.view === 'submissions') { loadSubmissions().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); }); return; }
        render();
      });
    });
    var lo = $('#logout');
    if (lo) lo.addEventListener('click', function () { setToken(''); state.me = null; render(); });
    var pkw = $('#prod-keyword');
    if (pkw) {
      pkw.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        state.productKeyword = pkw.value.trim();
        loadProducts();
      });
    }
    var psearch = $('#prod-search');
    if (psearch) psearch.addEventListener('click', function () {
      var box = $('#prod-keyword');
      state.productKeyword = box ? String(box.value || '').trim() : '';
      loadProducts();
    });
    var preset = $('#prod-reset');
    if (preset) preset.addEventListener('click', function () {
      state.productKeyword = '';
      state.productStatus = '';
      loadProducts();
    });
    var pstatus = $('#prod-status');
    if (pstatus) pstatus.addEventListener('change', function () {
      state.productStatus = String(pstatus.value || '');
      loadProducts();
    });
    bindProducts();
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-accept]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-accept'));
        b.disabled = true;
        var syncListing = !!state.subSyncListing;
        jfetch('/api/shop-cms/submissions/' + id + '/accept' + (syncListing ? '?sync_listing=true' : ''), { method: 'POST', body: JSON.stringify({}) })
          .then(function (d) { state.msg = '已采纳：扣 ' + Number(d.charged_credits || 0) + ' 积分（余额 ' + Number(d.credits_balance || 0) + '），素材已进商品素材' + (syncListing ? '，并已写进独立站素材（不用下架重上）' : ''); return jfetch('/api/shop-cms/merchants/me').then(function (m) { state.credits = m.credits || 0; state.me = m.merchant; }); })
          .then(function () { return Promise.all([loadSubmissions(), jfetch(productsQueryUrl()).then(function (d) { state.products = d.items || []; })]); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '采纳失败：' + e.message; render(); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-download]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-download'));
        b.disabled = true;
        jfetch('/api/shop-cms/submissions/' + id + '/download')
          .then(function (d) { if (d.url) window.open(d.url, '_blank', 'noopener'); state.msg = '已打开原素材下载'; return loadSubmissions(); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '下载失败：' + e.message; render(); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-reject]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-reject'));
        b.disabled = true;
        jfetch('/api/shop-cms/submissions/' + id + '/reject', { method: 'POST' })
          .then(function () { state.msg = '已忽略这条投稿'; return loadSubmissions(); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '忽略失败：' + e.message; render(); });
      });
    });
    var subSearch = $('#sub-search');
    if (subSearch) subSearch.addEventListener('click', function () {
      var kw = $('#sub-keyword'); var prod = $('#sub-product'); var st = $('#sub-status');
      state.subKeyword = kw ? kw.value.trim() : '';
      state.subProduct = prod ? Number(prod.value || 0) : 0;
      state.subStatus = st ? st.value : '';
      loadSubmissions().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); });
    });
    var ssl = $('#sub-sync-listing');
    if (ssl) ssl.addEventListener('change', function () { state.subSyncListing = !!ssl.checked; });
    var ss = $('#save-settings');
    if (ss) ss.addEventListener('click', function () {
      var theme = $('#s-theme').value;
      var body = {
        company_name: $('#s-name').value.trim(),
        intro: $('#s-intro').value,
        attribution_days: parseInt($('#s-days').value || '30', 10) || 30
      };
      if (theme) body.theme = { preset: theme };
      ss.disabled = true;
      jfetch('/api/shop-cms/merchants/me', { method: 'PUT', body: JSON.stringify(body) })
        .then(function () { state.msg = '设置已保存'; return loadAll(); })
        .then(render)
        .catch(function (e) { ss.disabled = false; state.msg = '保存失败：' + e.message; render(); });
    });
  }

  window.ShopCms = { state: state };
  render();
  if (token()) {
    loadAll().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); });
  }
})();
</script>
</body></html>
