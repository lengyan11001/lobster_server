<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商家后台 · shopcms.bhzn.top</title>
<style>
:root{--bg:#0f1115;--card:#161a21;--ink:#e8eaee;--dim:#9aa3b0;--line:rgba(255,255,255,.10);--brand:#2f7d46;--warn:#e0a84a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.top{position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.top .bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.brand{font-weight:650;letter-spacing:2px}.brand small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:1px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 0}
.tab{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
main{padding:22px 0 60px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px}
.kpi b{display:block;font-size:22px;margin-top:6px}
.kpi span{color:var(--dim);font-size:12px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-size:15px;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:middle}
th{color:var(--dim);font-weight:400}
input,select,textarea{background:#0c0e12;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;width:100%}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{background:var(--brand);border:0;color:#fff;border-radius:999px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.mini{padding:5px 12px;font-size:12px;font-weight:500}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.muted{color:var(--dim)}.ok{color:#4cc38a}.err{color:#ff6b6b}
.login{max-width:400px;margin:9vh auto;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:28px}
.login h1{margin:0 0 6px;font-size:20px;letter-spacing:1px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim)}
.tag.on{border-color:var(--brand);color:#7fd8a2}
.hint{font-size:12px;color:var(--dim);margin-top:10px}
.hint a{color:#7fd8a2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint.err{color:#ff6b6b}
.upload{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;background:#0c0e12}
.upload input[type=file]{border:0;padding:0;background:transparent;color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:110px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#0c0e12}
.thumb img{width:100%;height:86px;object-fit:cover;border-radius:8px;display:block}
.thumb .btn{width:100%;margin-top:6px}
.spec-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:8px;align-items:center}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<div class="top"><div class="wrap bar">
  <div class="brand">商家后台<small>shopcms.bhzn.top</small></div>
  <div id="who" class="muted"></div>
</div></div>
<div class="wrap"><main id="app"></main></div>
<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'shopcms_token_v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function yuan(c) { var v = Number(c || 0) / 100; return '¥' + (v % 1 === 0 ? v : v.toFixed(2)); }
  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function jfetch(path, opts) {
    var init = opts || {};
    init.headers = { 'Content-Type': 'application/json' };
    if (token()) init.headers.Authorization = 'Bearer ' + token();
    return fetch(path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { setToken(''); state.authNotice = '登录已过期，请重新登录'; render(); throw new Error(state.authNotice); }
        if (r.status === 403) {
          var raw = (d && (d.detail || d.message)) || '';
          var text = typeof raw === 'string' ? raw : ((raw && raw[0] && raw[0].msg) || '无权访问该接口');
          if (/停用|驳回|未通过/.test(text)) {
            setToken(''); state.me = null; state.products = []; state.orders = []; state.authNotice = text; render();
          }
          throw new Error(text);
        }
        if (!r.ok || d.ok === false) {
          var m = (d && (d.detail || d.message)) || ('HTTP ' + r.status);
          throw new Error(typeof m === 'string' ? m : JSON.stringify(m));
        }
        return d;
      });
    });
  }
  var state = { submissions: [], subProduct: 0, subStatus: '', subKeyword: '', view: 'overview', products: [], orders: [], me: null, summary: {}, editing: null, msg: '', formGallery: [], formDetailImages: [], authMode: 'login', authNotice: '' };

  function loginView() {
    if (state.authMode === 'register') {
      return [
        '<div class="login">',
        '<h1>开店入驻</h1><div class="muted">手机号 + 密码就能开店，注册后可直接上传商品</div>',
        '<label for="r-name">店铺 / 公司名称 *</label><input id="r-name" placeholder="如 天水花牛果专营店">',
        '<div class="row2">',
        '<div><label for="r-type">类型</label><select id="r-type"><option value="company">企业</option><option value="individual">个体 / 个人</option></select></div>',
        '<div><label for="r-region">地区</label><input id="r-region" placeholder="省市 / 区县"></div>',
        '</div>',
        '<div class="row2">',
        '<div><label for="r-contact">联系人</label><input id="r-contact" placeholder="姓名"></div>',
        '<div><label for="r-phone">手机号 *</label><input id="r-phone" autocomplete="username" placeholder="登录用手机号"></div>',
        '</div>',
        '<label for="r-pwd">登录密码 *</label><input id="r-pwd" type="password" autocomplete="new-password" placeholder="至少 6 位">',
        '<div style="margin-top:16px"><button class="btn" id="do-register" type="button" style="width:100%">开店入驻</button></div>',
        '<div class="hint' + (state.authNotice ? ' err' : '') + '" id="login-tip">' + (state.authNotice ? esc(state.authNotice) : '提交后立即开通（状态先为待审核，不影响你建商品、上架）。已经有店铺？<a href="javascript:void(0)" id="go-login">去登录</a>') + '</div>',
        '</div>'
      ].join('');
    }
    return [
      '<div class="login">',
      '<h1>商家后台登录</h1><div class="muted">用开店时的手机号 + 密码登录</div>',
      '<label for="acct">手机号 / 邮箱</label><input id="acct" autocomplete="username" placeholder="如 17000000000">',
      '<label for="pwd">密码</label><input id="pwd" type="password" autocomplete="current-password" placeholder="登录密码">',
      '<div style="margin-top:16px"><button class="btn" id="do-login" type="button" style="width:100%">登录</button></div>',
      '<div class="hint' + (state.authNotice ? ' err' : '') + '" id="login-tip">' + (state.authNotice ? esc(state.authNotice) : '还没有店铺？<a href="javascript:void(0)" id="go-register">立即开店入驻</a>（手机号 + 密码即可）') + '</div>',
      '</div>'
    ].join('');
  }

  function overviewView() {
    var m = state.me || {};
    var c = state.summary || {};
    var onSale = state.products.filter(function (p) { return p.status === 'on_sale'; }).length;
    return [
      '<div class="grid">',
      '<div class="kpi"><span>店铺</span><b>' + esc(m.company_name || '-') + '</b><span>slug: ' + esc(m.slug || '-') + ' · ' + esc(m.status || '') + '</span></div>',
      '<div class="kpi"><span>商品（在售/全部）</span><b>' + onSale + ' / ' + state.products.length + '</b><span>库存合计 ' + state.products.reduce(function (s, p) { return s + Number(p.stock || 0); }, 0) + '</span></div>',
      '<div class="kpi"><span>订单</span><b>' + state.orders.length + '</b><span>实付合计 ' + yuan(state.orders.reduce(function (s, o) { return s + Number(o.pay_amount_cents || 0); }, 0)) + '</span></div>',
      '<div class="kpi"><span>待结佣金</span><b>' + yuan(c.pending || 0) + '</b><span>已结 ' + yuan(c.settled || 0) + ' · 作废 ' + yuan(c.invalid || 0) + '</span></div>',
      '</div>',
      '<div class="panel"><h3>店铺信息</h3>',
      '<div class="muted">独立站：<a href="https://shop.bhzn.top/?slug=' + encodeURIComponent(m.slug || '') + '" target="_blank">https://shop.bhzn.top/?slug=' + esc(m.slug || '') + '</a></div>',
      '<div class="muted">佣金按商品设置（在「商品」里给每个商品填佣金%）· 平台抽成 ' + (Number(m.platform_fee_bp || 0) / 100) + '% · 归因窗口 ' + Number(m.attribution_days || 0) + ' 天</div>',
      '<div class="muted">主题：' + esc((m.theme || {}).preset || '（按类目自动）') + '</div>',
      '</div>',
      '<div class="panel"><h3>最近订单</h3>' + ordersTable(state.orders.slice(0, 5)) + '</div>'
    ].join('');
  }

  function statusTag(s) {
    var on = s === 'on_sale';
    return '<span class="tag' + (on ? ' on' : '') + '">' + esc(on ? '在售' : (s === 'off_shelf' ? '已下架' : s || '-')) + '</span>';
  }

  function productsView() {
    var rows = state.products.map(function (p) {
      return '<tr>' +
        '<td>' + esc(p.title) + '<div class="muted">' + esc(p.subtitle || '') + '</div></td>' +
        '<td>' + yuan(p.price_cents) + '</td>' +
        '<td>' + (Number(p.commission_bp || 0) / 100) + '%<div class="muted">预计 ' + yuan(p.commission_estimate_cents) + '</div></td>' +
        '<td>' + Number(p.stock || 0) + '</td>' +
        '<td>' + statusTag(p.status) + '</td>' +
        '<td>' +
        '<button class="btn mini ghost" data-edit="' + p.id + '" type="button">编辑</button> ' +
        '<button class="btn mini" data-toggle="' + p.id + '" data-on="' + (p.status === 'on_sale' ? '0' : '1') + '" type="button">' + (p.status === 'on_sale' ? '下架' : '上架') + '</button>' +
        '</td></tr>';
    }).join('');
    return [
      '<div class="panel"><h3>商品管理</h3>',
      '<table><thead><tr><th>商品</th><th>价格</th><th>佣金</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>',
      rows || '<tr><td colspan="6" class="muted">还没有商品，点下面「新建商品」</td></tr>',
      '</tbody></table>',
      '<div style="margin-top:16px"><button class="btn" id="new-product" type="button">新建商品</button></div>',
      state.editing ? productForm(state.editing) : '',
      '</div>'
    ].join('');
  }

  function specRowsHtml(specs) {
    var keys = Object.keys(specs || {});
    if (!keys.length) keys = [''];
    return keys.map(function (k) {
      return '<div class="spec-row" data-spec-row>' +
        '<input class="spec-k" placeholder="规格名，如 产地" value="' + esc(k) + '">' +
        '<input class="spec-v" placeholder="规格值，如 甘肃天水" value="' + esc(k && specs ? specs[k] : '') + '">' +
        '<button class="btn mini ghost" type="button" data-spec-del>删除</button>' +
        '</div>';
    }).join('');
  }

  function thumbsHtml(urls, kind) {
    if (!urls || !urls.length) return '<div class="muted" style="font-size:12px">还没上传图片</div>';
    return urls.map(function (u, i) {
      return '<div class="thumb"><img src="' + esc(u) + '" alt="">' +
        '<button class="btn mini ghost" type="button" data-img-del="' + kind + '" data-img-index="' + i + '">删除</button></div>';
    }).join('');
  }

  function statusOptions(cur) {
    return [['draft', '草稿'], ['on_sale', '直接上架'], ['off_shelf', '下架']].map(function (it) {
      return '<option value="' + it[0] + '"' + (cur === it[0] ? ' selected' : '') + '>' + it[1] + '</option>';
    }).join('');
  }

  function productForm(p) {
    var isNew = !p.id;
    var gallery = state.formGallery || [];
    var detailImages = state.formDetailImages || [];
    return [
      '<div class="panel" style="border-color:var(--brand)"><h3>' + (isNew ? '新建商品' : '编辑商品 #' + p.id) + '</h3>',
      '<div class="row">',
      '<div><label>标题</label><input id="f-title" value="' + esc(p.title || '') + '"></div>',
      '<div><label>副标题</label><input id="f-subtitle" value="' + esc(p.subtitle || '') + '"></div>',
      '<div><label>类目</label><input id="f-category" value="' + esc(p.category || '') + '"></div>',
      '<div><label>品牌</label><input id="f-brand" value="' + esc(p.brand || '') + '"></div>',
      '</div><div class="row">',
      '<div><label>售价（元）</label><input id="f-price" value="' + (Number(p.price_cents || 0) / 100) + '"></div>',
      '<div><label>划线价（元）</label><input id="f-market" value="' + (Number(p.market_price_cents || 0) / 100) + '"></div>',
      '<div><label>库存</label><input id="f-stock" value="' + Number(p.stock || 0) + '"></div>',
      '<div><label>佣金（%）</label><input id="f-bp" value="' + (Number(p.commission_bp_own || p.commission_bp || 0) / 100) + '">' +
      '<div class="hint">佣金按商品设置：推广者按这个比例拿佣</div></div>',
      '</div><div class="row">',
      '<div><label>标签（逗号分隔）</label><input id="f-tags" value="' + esc((p.tags || []).join ? (p.tags || []).join(',') : (p.tags || '')) + '"></div>',
      '<div><label>关键词</label><input id="f-keywords" value="' + esc(p.keywords || '') + '"></div>',
      '<div><label>状态</label><select id="f-status">' + statusOptions(p.status || 'draft') + '</select></div>',
      '</div>',
      '<label>商品图片（点下面选图上传，第一张自动作为主图）</label>',
      '<div class="upload"><input type="file" id="f-gallery" accept="image/*" multiple><span class="hint" id="f-gallery-tip">支持 jpg / png / webp / gif，单张不超过 8MB</span></div>',
      '<div class="thumbs">' + thumbsHtml(gallery, 'gallery') + '</div>',
      '<label>细节图（选填，可多张）</label>',
      '<div class="upload"><input type="file" id="f-detail-images" accept="image/*" multiple><span class="hint" id="f-detail-images-tip">展示在商品详情里</span></div>',
      '<div class="thumbs">' + thumbsHtml(detailImages, 'detail_images') + '</div>',
      '<label>规格参数（一行一个，不用写 JSON）</label>',
      '<div id="f-spec-rows">' + specRowsHtml(p.specs) + '</div>',
      '<div style="margin-top:8px"><button class="btn mini ghost" id="f-spec-add" type="button">添加一行</button></div>',
      '<label>商品详情（纯文字，换行分段，不用写 HTML）</label>',
      '<textarea id="f-detail-text" rows="4" placeholder="卖点、规格说明、发货说明…">' + esc(p.detail_text || '') + '</textarea>',
      '<div style="margin-top:14px"><button class="btn" id="save-product" type="button">保存</button> <button class="btn ghost" id="cancel-product" type="button">取消</button></div>',
      '</div>'
    ].join('');
  }

  function ordersTable(items) {
    var rows = (items || []).map(function (o) {
      return '<tr><td>' + esc(o.order_no) + '</td><td>' + esc(o.status) + '</td><td>' + yuan(o.pay_amount_cents) + '</td><td>' + yuan(o.commission_cents) + '</td><td>' + esc(o.commission_status || '-') + '</td><td class="muted">' + esc((o.created_at || '').replace('T', ' ').slice(0, 19)) + '</td></tr>';
    }).join('');
    return '<table><thead><tr><th>订单号</th><th>状态</th><th>实付</th><th>佣金</th><th>佣金状态</th><th>时间</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="muted">暂无订单</td></tr>') + '</tbody></table>';
  }

  function commissionsView() {
    var c = state.summary || {};
    var keys = Object.keys(c);
    return '<div class="panel"><h3>佣金概览</h3><table><thead><tr><th>状态</th><th>金额</th></tr></thead><tbody>' +
      (keys.length ? keys.map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + yuan(c[k]) + '</td></tr>'; }).join('') : '<tr><td colspan="2" class="muted">暂无佣金记录</td></tr>') +
      '</tbody></table><div class="hint">订单状态推进到 paid/shipped/completed 后佣金才从 pending 进入 confirmed/settled（当前状态机由后续版本补齐）。</div></div>';
  }

  function submissionsView() {
    var productOptions = ['<option value="0">全部商品</option>'].concat((state.products || []).map(function (p) {
      return '<option value="' + p.id + '"' + (Number(state.subProduct) === Number(p.id) ? ' selected' : '') + '>' + esc(p.title || ('#' + p.id)) + '</option>';
    })).join('');
    var rows = (state.submissions || []).map(function (it) {
      var statusText = { new: '待处理', used: '已使用', rejected: '已忽略' }[it.status] || it.status;
      var thumb = it.thumb_url || it.url || '';
      var isImage = String(it.media_type || '') === 'image' || /\.(png|jpe?g|webp|gif)$/i.test(String(it.url || ''));
      var preview = it.preview_url || '';
      return '<tr><td>' + (preview
          ? '<a href="' + esc(preview) + '" target="_blank" rel="noopener" title="带水印预览，采纳后才能下载原素材">' + (isImage
            ? (it.preview_kind === 'video' ? ('<video src="' + esc(preview) + '" poster="' + esc(it.poster_url || '') + '" muted preload="metadata" style="width:96px;height:64px;object-fit:cover;border-radius:6px;background:#000"></video>') : ('<img src="' + esc(preview) + '" style="width:64px;height:64px;object-fit:cover;border-radius:6px" alt="">'))
            : '<span class="muted">视频</span>') + '</a>'
          : '<span class="muted">-</span>') + '</td>'
        + '<td>' + esc(it.title || '-') + '<div class="muted">' + esc(it.media_type || '') + '</div></td>'
        + '<td>' + esc((it.product || {}).title || ('#' + it.product_id)) + '</td>'
        + '<td>' + esc(((it.submitter || {}).phone) || '') + '</td>'
        + '<td class="muted">' + esc(String(it.created_at || '').replace('T', ' ').slice(0, 19)) + '</td>'
        + '<td>' + esc(statusText) + (it.accepted ? '<div class="muted">-' + Number(it.price_credits || 0) + ' 积分</div>' : '<div class="muted">采纳 -' + Number(it.price_credits || 0) + '</div>') + '</td>'
        + '<td><button class="btn mini" data-sub-accept="' + it.id + '" type="button"' + (it.accepted ? ' disabled' : '') + '>'
        + (it.accepted ? '已采纳' : '采纳（-' + Number(it.price_credits || 0) + ' 积分）') + '</button> '
        + '<button class="btn mini ghost" data-sub-download="' + it.id + '" type="button"' + (it.accepted ? '' : ' disabled title="采纳后才能下载原素材"') + '>下载</button> '
        + '<button class="btn mini ghost" data-sub-reject="' + it.id + '" type="button">忽略</button></td></tr>';
    }).join('');
    return '<div class="panel"><h3>素材投稿</h3>'
      + '<div class="row">'
      + '<div><label>按商品搜</label><input id="sub-keyword" value="' + esc(state.subKeyword || '') + '" placeholder="商品名 / SPU / 关键词"></div>'
      + '<div><label>商品</label><select id="sub-product">' + productOptions + '</select></div>'
      + '<div><label>状态</label><select id="sub-status">'
      + [['', '全部'], ['new', '待处理'], ['used', '已使用'], ['rejected', '已忽略']].map(function (s) {
          return '<option value="' + s[0] + '"' + (state.subStatus === s[0] ? ' selected' : '') + '>' + s[1] + '</option>';
        }).join('') + '</select></div>'
      + '<div><button class="btn" id="sub-search" type="button">查询</button></div>'
      + '</div>'
      + '<table><thead><tr><th>素材</th><th>标题</th><th>商品</th><th>投稿人</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>'
      + (rows || '<tr><td colspan="7" class="muted">暂无投稿素材</td></tr>') + '</tbody></table>'
      + '<div class="hint">未采纳时只能看带水印预览，下载不了；点「采纳」才会从你的积分里扣钱（图片 100 / 视频 300），并把同样积分给投稿人，素材同时进商品素材；采纳后才能下载原素材。</div>'
      + '</div>';
  }

  function loadSubmissions() {
    var qs = '/api/shop-cms/submissions?size=100'
      + '&product_id=' + Number(state.subProduct || 0)
      + '&status=' + encodeURIComponent(state.subStatus || '')
      + '&keyword=' + encodeURIComponent(state.subKeyword || '');
    return jfetch(qs).then(function (d) { state.submissions = d.items || []; });
  }
  function settingsView() {
    var m = state.me || {};
    return [
      '<div class="panel"><h3>店铺设置</h3>',
      '<div class="row">',
      '<div><label>店铺名</label><input id="s-name" value="' + esc(m.company_name || '') + '"></div>',
      '<div><label>主题</label><select id="s-theme">' +
      ['', 'fresh_green', 'dark_gold', 'clean_blue', 'warm_beige'].map(function (t) {
        var cur = ((m.theme || {}).preset || '');
        return '<option value="' + t + '"' + (t === cur ? ' selected' : '') + '>' + (t || '按类目自动') + '</option>';
      }).join('') + '</select></div>',
      '<div><label>归因天数</label><input id="s-days" value="' + Number(m.attribution_days || 0) + '"></div>',
      '</div>',
      '<div class="hint">佣金不在这里设置：进「商品」编辑每个商品时填佣金%。</div>',
      '<label>店铺介绍（独立站「店铺介绍」段落，换行分段）</label><textarea id="s-intro" rows="3">' + esc(m.intro || '') + '</textarea>',
      '<div style="margin-top:14px"><button class="btn" id="save-settings" type="button">保存设置</button></div>',
      '</div>'
    ].join('');
  }

  function render() {
    var app = $('#app');
    if (!token()) { app.innerHTML = loginView(); bindLogin(); return; }
    var tabs = [['overview', '概览'], ['products', '商品'], ['submissions', '素材投稿'], ['orders', '订单'], ['commissions', '佣金'], ['settings', '设置']];
    var body = state.view === 'submissions' ? submissionsView()
      : state.view === 'products' ? productsView()
      : state.view === 'orders' ? '<div class="panel"><h3>订单</h3>' + ordersTable(state.orders) + '</div>'
        : state.view === 'commissions' ? commissionsView()
          : state.view === 'settings' ? settingsView() : overviewView();
    app.innerHTML = '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="tab' + (state.view === t[0] ? ' on' : '') + '" data-view="' + t[0] + '" type="button">' + t[1] + '</button>';
    }).join('') + '<button class="tab" id="logout" type="button">退出登录</button></div>' +
      (state.msg ? '<div class="panel" style="border-color:var(--brand)">' + esc(state.msg) + '</div>' : '') + body;
    $('#who').textContent = state.me ? (state.me.company_name + ' · ' + state.me.slug) : '';
    if (state.me) { $('#who').textContent += ' · 积分 ' + Number(state.credits || 0); }
    bindApp();
  }

  function loadAll() {
    return Promise.all([
      jfetch('/api/shop-cms/merchants/me'),
      jfetch('/api/shop-cms/products?size=100'),
      jfetch('/api/shop-cms/orders?size=50'),
      jfetch('/api/shop-cms/commissions/summary')
    ]).then(function (r) {
      state.me = r[0].merchant;
      state.credits = r[0].credits || 0;
      state.products = r[1].items || [];
      state.orders = r[2].items || [];
      state.summary = r[3].by_status || {};
    });
  }

  function bindLogin() {
    var toRegister = $('#go-register');
    if (toRegister) toRegister.addEventListener('click', function () { state.authMode = 'register'; state.msg = ''; state.authNotice = ''; render(); });
    var toLogin = $('#go-login');
    if (toLogin) toLogin.addEventListener('click', function () { state.authMode = 'login'; state.msg = ''; state.authNotice = ''; render(); });
    var rbtn = $('#do-register');
    if (rbtn) rbtn.addEventListener('click', function () { doRegister(rbtn); });
    var btn = $('#do-login');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var acct = $('#acct').value.trim(), pwd = $('#pwd').value;
      var tip = $('#login-tip');
      state.authNotice = '';
      if (!acct || !pwd) { tip.className = 'hint err'; tip.textContent = '请输入手机号和密码'; return; }
      btn.disabled = true; tip.className = 'hint'; tip.textContent = '登录中…';
      fetch('/auth/login-phone-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account: acct, password: pwd }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.s !== 200 || !res.d.access_token) throw new Error(res.d.detail || ('HTTP ' + res.s));
          setToken(res.d.access_token);
          return loadAll().then(function () { render(); });
        })
        .catch(function (e) { btn.disabled = false; tip.className = 'hint err'; tip.textContent = '登录失败：' + e.message; });
    });
  }

  function doRegister(btn) {
    var tip = $('#login-tip');
    var body = {
      company_name: ($('#r-name').value || '').trim(),
      company_type: ($('#r-type').value || 'company'),
      phone: ($('#r-phone').value || '').trim(),
      password: $('#r-pwd').value || '',
      contact_name: ($('#r-contact').value || '').trim(),
      region: ($('#r-region').value || '').trim()
    };
    if (!body.company_name) { tip.className = 'hint err'; tip.textContent = '请填店铺 / 公司名称'; return; }
    if (!body.phone || !body.password) { tip.className = 'hint err'; tip.textContent = '请填手机号和密码'; return; }
    if (body.password.length < 6) { tip.className = 'hint err'; tip.textContent = '密码至少 6 位'; return; }
    btn.disabled = true; tip.className = 'hint'; tip.textContent = '正在开通店铺…';
    fetch('/api/shop-cms/merchants/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (res) {
        if (res.s !== 200 && res.s !== 201) throw new Error(res.d.detail || ('HTTP ' + res.s));
        tip.textContent = '店铺已开通，正在登录…';
        return fetch('/auth/login-phone-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account: body.phone, password: body.password }) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; }); });
      })
      .then(function (res) {
        if (res.s !== 200 || !res.d.access_token) throw new Error('开店成功，但自动登录失败，请手动登录');
        setToken(res.d.access_token);
        state.authMode = 'login';
        return loadAll().then(function () { state.msg = '店铺已开通，先去「商品」上传你的商品吧'; state.view = 'products'; render(); });
      })
      .catch(function (e) { btn.disabled = false; tip.className = 'hint err'; tip.textContent = e.message; });
  }

  function uploadImage(file, tipEl) {
    var fd = new FormData();
    fd.append('file', file);
    var headers = {};
    if (token()) headers.Authorization = 'Bearer ' + token();
    if (tipEl) { tipEl.className = 'hint'; tipEl.textContent = '上传中：' + file.name; }
    return fetch('/api/shop-cms/uploads', { method: 'POST', headers: headers, body: fd }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || d.ok === false) throw new Error(d.detail || d.message || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function uploadFiles(input, kind) {
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var tip = $(kind === 'detail_images' ? '#f-detail-images-tip' : '#f-gallery-tip');
    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        return uploadImage(f, tip).then(function (d) {
          if (kind === 'detail_images') state.formDetailImages.push(d.url);
          else state.formGallery.push(d.url);
        });
      });
    });
    chain.then(function () {
      state.msg = '图片已上传（' + files.length + ' 张）';
      render();
    }).catch(function (e) {
      state.msg = '图片上传失败：' + e.message;
      render();
    });
  }

  function collectSpecs() {
    var out = {};
    Array.prototype.forEach.call(document.querySelectorAll('#f-spec-rows [data-spec-row]'), function (row) {
      var k = (row.querySelector('.spec-k').value || '').trim();
      var v = (row.querySelector('.spec-v').value || '').trim();
      if (k) out[k] = v;
    });
    return out;
  }

  function bindProductForm() {
    var g = $('#f-gallery');
    if (g) g.addEventListener('change', function () { uploadFiles(g, 'gallery'); });
    var di = $('#f-detail-images');
    if (di) di.addEventListener('change', function () { uploadFiles(di, 'detail_images'); });
    var add = $('#f-spec-add');
    if (add) add.addEventListener('click', function () {
      var host = $('#f-spec-rows');
      if (!host) return;
      var div = document.createElement('div');
      div.className = 'spec-row';
      div.setAttribute('data-spec-row', '');
      div.innerHTML = '<input class="spec-k" placeholder="规格名"><input class="spec-v" placeholder="规格值"><button class="btn mini ghost" type="button" data-spec-del>删除</button>';
      host.appendChild(div);
      bindSpecDelete(div);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#f-spec-rows [data-spec-row]'), bindSpecDelete);
    Array.prototype.forEach.call(document.querySelectorAll('[data-img-del]'), function (b) {
      b.addEventListener('click', function () {
        var kind = b.getAttribute('data-img-del');
        var idx = Number(b.getAttribute('data-img-index'));
        var list = kind === 'detail_images' ? state.formDetailImages : state.formGallery;
        list.splice(idx, 1);
        render();
      });
    });
  }

  function bindSpecDelete(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll('[data-spec-del]'), function (b) {
      b.addEventListener('click', function () {
        var row = b.closest('[data-spec-row]');
        if (row) row.remove();
      });
    });
  }

  function bindApp() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) {
      b.addEventListener('click', function () {
        state.view = b.getAttribute('data-view'); state.editing = null; state.msg = '';
        if (state.view === 'submissions') { loadSubmissions().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); }); return; }
        render();
      });
    });
    var lo = $('#logout');
    if (lo) lo.addEventListener('click', function () { setToken(''); state.me = null; render(); });
    var np = $('#new-product');
    if (np) np.addEventListener('click', function () {
      state.formGallery = []; state.formDetailImages = [];
      state.editing = { status: 'draft', commission_bp_own: 1000 };
      render();
    });
    bindProductForm();
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-accept]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-accept'));
        b.disabled = true;
        jfetch('/api/shop-cms/submissions/' + id + '/accept', { method: 'POST', body: JSON.stringify({}) })
          .then(function (d) { state.msg = '已采纳：扣 ' + Number(d.charged_credits || 0) + ' 积分（余额 ' + Number(d.credits_balance || 0) + '），素材已进商品素材'; return jfetch('/api/shop-cms/merchants/me').then(function (m) { state.credits = m.credits || 0; state.me = m.merchant; }); })
          .then(function () { return Promise.all([loadSubmissions(), jfetch('/api/shop-cms/products?size=100').then(function (d) { state.products = d.items || []; })]); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '采纳失败：' + e.message; render(); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-download]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-download'));
        b.disabled = true;
        jfetch('/api/shop-cms/submissions/' + id + '/download')
          .then(function (d) { if (d.url) window.open(d.url, '_blank', 'noopener'); state.msg = '已打开原素材下载'; return loadSubmissions(); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '下载失败：' + e.message; render(); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sub-reject]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-sub-reject'));
        b.disabled = true;
        jfetch('/api/shop-cms/submissions/' + id + '/reject', { method: 'POST' })
          .then(function () { state.msg = '已忽略这条投稿'; return loadSubmissions(); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '忽略失败：' + e.message; render(); });
      });
    });
    var subSearch = $('#sub-search');
    if (subSearch) subSearch.addEventListener('click', function () {
      var kw = $('#sub-keyword'); var prod = $('#sub-product'); var st = $('#sub-status');
      state.subKeyword = kw ? kw.value.trim() : '';
      state.subProduct = prod ? Number(prod.value || 0) : 0;
      state.subStatus = st ? st.value : '';
      loadSubmissions().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); });
    });
    var cp = $('#cancel-product');
    if (cp) cp.addEventListener('click', function () { state.editing = null; render(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-edit'));
        var found = state.products.filter(function (p) { return p.id === id; })[0] || null;
        state.editing = found;
        state.formGallery = found && found.gallery ? found.gallery.slice() : [];
        state.formDetailImages = found && found.detail_images ? found.detail_images.slice() : [];
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function (b) {
      b.addEventListener('click', function () {
        var id = Number(b.getAttribute('data-toggle')), on = b.getAttribute('data-on') === '1';
        b.disabled = true;
        jfetch('/api/shop-cms/products/' + id + '/publish?on=' + (on ? 'true' : 'false'), { method: 'POST' })
          .then(function () { state.msg = '商品 #' + id + (on ? ' 已上架' : ' 已下架'); return loadAll(); })
          .then(render)
          .catch(function (e) { b.disabled = false; state.msg = '操作失败：' + e.message; render(); });
      });
    });
    var sp = $('#save-product');
    if (sp) sp.addEventListener('click', function () {
      var bpPct = Number($('#f-bp').value || 0);
      var gallery = (state.formGallery || []).slice();
      if (!gallery.length) { state.msg = '请先上传至少一张商品图片'; render(); return; }
      if (!(bpPct > 0)) { state.msg = '请填商品佣金（%）：佣金按商品设置'; render(); return; }
      var payload = {
        title: $('#f-title').value.trim(),
        subtitle: $('#f-subtitle').value.trim(),
        category: $('#f-category').value.trim(),
        brand: $('#f-brand').value.trim(),
        keywords: $('#f-keywords').value.trim(),
        price_cents: Math.round(Number($('#f-price').value || 0) * 100),
        market_price_cents: Math.round(Number($('#f-market').value || 0) * 100),
        stock: parseInt($('#f-stock').value || '0', 10) || 0,
        commission_bp: Math.round(bpPct * 100),
        commission_type: 'percent',
        tags: $('#f-tags').value.trim(),
        cover_url: gallery[0],
        gallery: gallery,
        detail_images: (state.formDetailImages || []).slice(),
        detail_text: $('#f-detail-text').value,
        specs: collectSpecs(),
        status: $('#f-status').value
      };
      if (!payload.title) { state.msg = '标题不能为空'; render(); return; }
      sp.disabled = true;
      var url = state.editing && state.editing.id ? ('/api/shop-cms/products/' + state.editing.id) : '/api/shop-cms/products';
      jfetch(url, { method: state.editing && state.editing.id ? 'PUT' : 'POST', body: JSON.stringify(payload) })
        .then(function (r) {
          var pid = r.product ? r.product.id : (state.editing || {}).id;
          state.editing = null;
          state.msg = '已保存商品 #' + pid;
          if (payload.status === 'on_sale' && pid) {
            return jfetch('/api/shop-cms/products/' + pid + '/publish?on=true', { method: 'POST' }).then(loadAll);
          }
          return loadAll();
        })
        .then(function () { state.view = 'products'; render(); })
        .catch(function (e) { sp.disabled = false; state.msg = '保存失败：' + e.message; render(); });
    });
    var ss = $('#save-settings');
    if (ss) ss.addEventListener('click', function () {
      var theme = $('#s-theme').value;
      var body = {
        company_name: $('#s-name').value.trim(),
        intro: $('#s-intro').value,
        attribution_days: parseInt($('#s-days').value || '30', 10) || 30
      };
      if (theme) body.theme = { preset: theme };
      ss.disabled = true;
      jfetch('/api/shop-cms/merchants/me', { method: 'PUT', body: JSON.stringify(body) })
        .then(function () { state.msg = '设置已保存'; return loadAll(); })
        .then(render)
        .catch(function (e) { ss.disabled = false; state.msg = '保存失败：' + e.message; render(); });
    });
  }

  window.ShopCms = { state: state };
  render();
  if (token()) {
    loadAll().then(render).catch(function (e) { state.msg = '加载失败：' + e.message; render(); });
  }
})();
</script>
</body></html>
