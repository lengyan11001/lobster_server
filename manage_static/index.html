      + '<div class="dsec"><h4>备注</h4><textarea id="cuNotes" rows="3">' + (c ? (c.notes || "") : "") + '</textarea></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="cuCancel">取消</button>'
      + '<button class="btn sm" id="cuOk">' + (c ? "保存" : "创建") + '</button></div>';
    openDrawer(c ? "客户 · 编辑" : "客户 · 新增", c ? c.name : "新增客户", html);
    document.getElementById("cuCancel").addEventListener("click", closeDrawer);
    document.getElementById("cuOk").addEventListener("click", function(){
      var name = document.getElementById("cuName").value.trim();
      if (!name) return toast("请填客户姓名", true);
      var body = {
        name: name, company_name: document.getElementById("cuCompany").value.trim(),
        phone: document.getElementById("cuPhone").value.trim(),
        wechat: document.getElementById("cuWechat").value.trim(),
        source: document.getElementById("cuSource").value.trim(),
        stage: document.getElementById("cuStage").value,
        amount: Number(document.getElementById("cuAmount").value || 0),
        next_action: document.getElementById("cuNext").value.trim(),
        next_follow_at: document.getElementById("cuNextAt").value.trim(),
        notes: document.getElementById("cuNotes").value.trim()
      };
      var req = c ? api("/api/manage/customers/" + c.id, { method: "PATCH", body: body })
                  : api("/api/manage/customers", { method: "POST", body: Object.assign({ company_id: ACTIVE }, body) });
      req.then(function(){ closeDrawer(); toast(c ? "已保存" : "已创建"); loadCrm(); loadDeliv(); })
         .catch(function(e){ toast(e.message, true); });
    });
  }

  function deleteCustomer(id){
    var c = CRM_CACHE.filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    openDrawer("客户 · 删除", c.name,
      '<div class="dsec"><h4>确认删除</h4><div style="font-size:13px;line-height:1.7">将删除客户 <b>' + c.name + '</b> 及其全部跟进记录。</div></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="cdNo">取消</button>'
      + '<button class="btn sm" id="cdYes" style="background:linear-gradient(100deg,#fda4af,#fb7185);color:#210a10">确认删除</button></div>');
    document.getElementById("cdNo").addEventListener("click", closeDrawer);
    document.getElementById("cdYes").addEventListener("click", function(){
      api("/api/manage/customers/" + id, { method: "DELETE" })
        .then(function(){ closeDrawer(); toast("已删除"); loadCrm(); loadDeliv(); })
        .catch(function(e){ toast(e.message, true); });
    });
  }

  function openFollowUp(id){
    api("/api/manage/customers/" + id).then(function(d){
      var c = d.customer || {};
      var logs = c.logs || [];
      var stageOpts = Object.keys(CRM_STAGES).map(function(k){
        return '<option value="' + k + '"' + (c.stage === k ? " selected" : "") + '>' + CRM_STAGES[k] + '</option>';
      }).join("");
      var timeline = logs.length ? logs.map(function(x){
        return '<div class="mline"><span class="nm" style="flex:1">' + (x.content || "（无正文）")
          + (x.to_stage ? '<span class="dim" style="margin-left:6px">→ ' + (CRM_STAGES[x.to_stage] || x.to_stage) + '</span>' : '')
          + '</span><span class="dim num">' + (x.happened_at || "") + '</span></div>';
      }).join("") : '<div class="dim" style="font-size:12.5px">还没有跟进记录</div>';
      openDrawer("客户 · 跟进", c.name,
        '<div class="dsec"><h4>当前</h4>'
        + '<div class="mline"><span class="nm">阶段</span><span class="mut">' + (c.stage_label || c.stage) + '</span></div>'
        + '<div class="mline"><span class="nm">金额</span><span class="mut num">¥' + Number(c.amount || 0).toLocaleString("zh-CN") + '</span></div>'
        + '<div class="mline"><span class="nm">最近跟进</span><span class="mut">' + (c.last_follow_at || "—") + '</span></div></div>'
        + '<div class="dsec"><h4>加一条跟进</h4>'
        + '<textarea id="fuText" rows="3" placeholder="沟通了什么、对方反馈、下一步"></textarea>'
        + '<div style="display:flex;gap:10px;margin-top:10px">'
        + '<div style="flex:1"><label class="fl">方式</label><select id="fuKind">'
        + [["call","电话"],["wechat","微信"],["visit","上门"],["note","备注"]].map(function(x){
            return '<option value="' + x[0] + '">' + x[1] + '</option>'; }).join("")
        + '</select></div>'
        + '<div style="flex:1"><label class="fl">推进到阶段</label><select id="fuStage"><option value="">不变</option>' + stageOpts + '</select></div></div>'
        + '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sm" id="fuOk">提交跟进</button></div></div>'
        + '<div class="dsec"><h4>跟进时间线</h4>' + timeline + '</div>');
      document.getElementById("fuOk").addEventListener("click", function(){
        var text = document.getElementById("fuText").value.trim();
        if (!text) return toast("写点内容", true);
        api("/api/manage/customers/" + id + "/log", { method: "POST", body: {
          kind: document.getElementById("fuKind").value, content: text,
          to_stage: document.getElementById("fuStage").value } })
          .then(function(){ toast("已记录"); loadCrm(); openFollowUp(id); loadDeliv(); })
          .catch(function(e){ toast(e.message, true); });
      });
    }).catch(function(e){ toast(e.message, true); });
  }

  /* ================= 交付 ================= */
  var DELIV_STATUS = "", DELIV_CACHE = [], DELIV_LABELS = {}, DELIV_COUNTS = {};

  function delivCard(x){
    var c = x.status === "accepted" ? "#6ee7b7" : (x.status === "review" ? "#fcd34d" : (x.status === "doing" ? "#7fe6f7" : "#8b98ae"));
    var nxt = { pending: ["doing", "开始交付"], doing: ["review", "提交验收"], review: ["accepted", "确认验收"] }[x.status] || [];
    return '<div class="glass card" style="padding:14px">'
      + '<div class="row" style="align-items:center;gap:9px">'
      + '<b style="font-size:13.5px">' + x.name + '</b>'
      + '<span class="tag" style="color:' + c + ';border-color:' + c + '66">' + (x.status_label || x.status) + '</span>'
      + '<span class="grow"></span><span class="dim" style="font-size:11.5px">' + (x.owner_name || "未指派") + '</span></div>'
      + '<div class="dim" style="font-size:11.5px;margin-top:6px">客户 ' + (x.customer_name || "—")
      + (x.promised_at ? (" · 承诺 " + x.promised_at) : "") + (x.delivered_at ? (" · 已交付 " + x.delivered_at) : "") + '</div>'
      + (x.note ? '<div class="mut" style="font-size:12px;margin-top:8px">' + x.note + '</div>' : '')
      + '<div class="row" style="gap:7px;justify-content:flex-end;margin-top:11px">'
      + (nxt.length ? '<button class="btn sm" data-dnext="' + x.id + '" data-to="' + nxt[0] + '">' + nxt[1] + '</button>' : '')
      + '<button class="btn sm ghost" data-dedit="' + x.id + '">编辑</button>'
      + '<button class="btn sm ghost" data-ddel="' + x.id + '" style="color:#fda4af;border-color:rgba(251,113,133,.4)">删除</button>'
      + '</div></div>';
  }
  function loadDeliv(){
    api("/api/manage/deliveries?company_id=" + ACTIVE + (DELIV_STATUS ? ("&status=" + DELIV_STATUS) : ""))
      .then(function(d){
        DELIV_CACHE = d.deliveries || []; DELIV_LABELS = d.labels || {}; DELIV_COUNTS = d.counts || {};
        var pend = d.won_without_delivery || [];
        $("#s-deliv").innerHTML = '<div class="glass card">'
          + '<div class="row" style="align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap">'
          + '<b style="font-size:13.5px">交付</b><span class="dim" style="font-size:12px">已成交客户 → 交付单 → 验收</span>'
          + '<span class="grow"></span><button class="btn sm" id="addDeliv">＋ 新建交付单</button></div>'
          + '<div class="arrbar" style="margin-bottom:12px">'
          + '<button class="btn sm ' + (DELIV_STATUS === "" ? "" : "ghost") + '" data-dstatus="">全部</button>'
          + Object.keys(DELIV_LABELS).map(function(k){
              return '<button class="btn sm ' + (DELIV_STATUS === k ? "" : "ghost") + '" data-dstatus="' + k + '">'
                + DELIV_LABELS[k] + ' <b class="num">' + (DELIV_COUNTS[k] || 0) + '</b></button>'; }).join("")
          + '</div>'
          + (pend.length ? '<div class="dsec" style="border-color:rgba(251,191,36,.4);margin-bottom:12px">'
              + '<h4>已成交但还没建交付单（' + pend.length + '）</h4>'
              + pend.map(function(c){
                  return '<div class="mline"><span class="nm">' + c.name + '<span class="dim num" style="margin-left:8px">¥'
                    + Number(c.amount || 0).toLocaleString("zh-CN") + '</span></span>'
                    + '<button class="btn sm" data-dfrom="' + c.id + '" data-name="' + c.name + '">建交付单</button></div>'; }).join("")
              + '</div>' : '')
          + (DELIV_CACHE.length ? '<div class="g3">' + DELIV_CACHE.map(delivCard).join("") + '</div>'
                                : '<div class="dim">还没有交付单。客户成交后这里会自动提醒建单。</div>')
          + '</div>';
        $$("#s-deliv [data-dstatus]").forEach(function(b){
          b.addEventListener("click", function(){ DELIV_STATUS = b.dataset.dstatus; loadDeliv(); });
        });
        document.getElementById("addDeliv").addEventListener("click", function(){ openDelivery(null); });
        $$("#s-deliv [data-dedit]").forEach(function(b){ b.addEventListener("click", function(){ openDelivery(Number(b.dataset.dedit)); }); });
        $$("#s-deliv [data-ddel]").forEach(function(b){
          b.addEventListener("click", function(){
            api("/api/manage/deliveries/" + b.dataset.ddel, { method: "DELETE" })
              .then(function(){ toast("已删除"); loadDeliv(); }).catch(function(e){ toast(e.message, true); });
          });
        });
        $$("#s-deliv [data-dnext]").forEach(function(b){
          b.addEventListener("click", function(){
            api("/api/manage/deliveries/" + b.dataset.dnext, { method: "PATCH", body: { status: b.dataset.to } })
              .then(function(){ toast("已推进"); loadDeliv(); }).catch(function(e){ toast(e.message, true); });
          });
        });
        $$("#s-deliv [data-dfrom]").forEach(function(b){
          b.addEventListener("click", function(){
            api("/api/manage/deliveries", { method: "POST", body: { company_id: ACTIVE,
              name: b.dataset.name + " 交付", customer_id: Number(b.dataset.dfrom) } })
              .then(function(){ toast("已建交付单"); loadDeliv(); }).catch(function(e){ toast(e.message, true); });
          });
        });
      }).catch(function(e){ showErr(e.message); });
  }

  function openDelivery(id){
    var x = id ? DELIV_CACHE.filter(function(y){ return y.id === id; })[0] : null;
    var html = '<div class="dsec"><h4>交付单</h4>'
      + '<label class="fl">名称</label><input id="dvName" value="' + (x ? x.name : "") + '" style="margin-bottom:10px" placeholder="例如：华创科技 抖音代运营交付" />'
      + '<div style="display:flex;gap:10px;margin-bottom:10px">'
      + '<div style="flex:1"><label class="fl">承诺交付时间</label><input id="dvPromised" value="' + (x ? (x.promised_at || "") : "") + '" placeholder="2026-10-01" /></div>'
      + (x ? '<div style="flex:1"><label class="fl">状态</label><select id="dvStatus">'
            + Object.keys(DELIV_LABELS).map(function(k){
                return '<option value="' + k + '"' + (x.status === k ? " selected" : "") + '>' + DELIV_LABELS[k] + '</option>'; }).join("")
            + '</select></div>' : '')
      + '</div><label class="fl">备注</label><textarea id="dvNote" rows="3">' + (x ? (x.note || "") : "") + '</textarea></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="dvCancel">取消</button>'
      + '<button class="btn sm" id="dvOk">' + (x ? "保存" : "创建") + '</button></div>';
    openDrawer(x ? "交付 · 编辑" : "交付 · 新建", x ? x.name : "新建交付单", html);
    document.getElementById("dvCancel").addEventListener("click", closeDrawer);
    document.getElementById("dvOk").addEventListener("click", function(){
      var name = document.getElementById("dvName").value.trim();
      if (!name) return toast("请填名称", true);
      var body = { name: name, promised_at: document.getElementById("dvPromised").value.trim(),
                   note: document.getElementById("dvNote").value.trim() };
      var req = x ? api("/api/manage/deliveries/" + x.id, { method: "PATCH",
                      body: Object.assign(body, { status: document.getElementById("dvStatus").value }) })
                  : api("/api/manage/deliveries", { method: "POST", body: Object.assign({ company_id: ACTIVE }, body) });
      req.then(function(){ closeDrawer(); toast(x ? "已保存" : "已创建"); loadDeliv(); })
         .catch(function(e){ toast(e.message, true); });
    });
  }

  /* ================= 虚拟员工 ================= */
  var AI_CACHE = [];
  var CAP_LIST = ["抖音发布","私信承接","线索采集","批量剪辑","字幕生成","朋友圈","社群群发","消息承接","视频号发布","数据报表"];

  function aiCard(a){
    return '<div class="glass card" style="padding:14px">'
      + '<div class="row" style="align-items:center;gap:11px">'
      + '<div style="width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font:600 12px var(--mono);color:#06121c;background:conic-gradient(from 130deg,#22d3ee,#6366f1,#a855f7,#22d3ee)">AI</div>'
      + '<div style="flex:1;min-width:0"><b style="font-size:13.5px">' + a.name + '</b>'
      + '<div class="dim" style="font-size:11px;margin-top:3px;word-break:break-all">' + a.installation_id + '</div></div>'
      + '<span class="tag ' + (a.online ? "ok" : "") + '" style="' + (a.online ? "" : "color:#5a6577") + '"><span class="' + (a.online ? "dot" : "off-dot") + '"></span>' + (a.online ? "在线" : "离线") + '</span></div>'
      + '<div class="dim" style="font-size:11.5px;margin-top:9px">归属 ' + (a.owner_name || "—") + ' · 已派 ' + (a.dispatched || 0) + ' 次</div>'
      + '<div style="margin-top:9px">' + ((a.capabilities || []).length
          ? (a.capabilities || []).map(function(c){ return '<span class="tag cy" style="margin:0 5px 5px 0">' + c + '</span>'; }).join("")
          : '<span class="dim" style="font-size:11.5px">能力未配置（可在「配置」里勾选）</span>') + '</div>'
      + '<div class="row" style="gap:7px;justify-content:flex-end;margin-top:11px">'
      + '<button class="btn sm ghost" data-aedit="' + a.id + '">配置</button>'
      + '<button class="btn sm ghost" data-adel="' + a.id + '" style="color:#fda4af;border-color:rgba(251,113,133,.4)">移除</button>'
      + '</div></div>';
  }
  function loadAi(){
    api("/api/manage/ai-employees?company_id=" + ACTIVE).then(function(d){
      AI_CACHE = d.ai_employees || [];
      $("#s-ai").innerHTML = '<div class="glass card" style="margin-bottom:12px">'
        + '<div class="row" style="align-items:center;gap:10px">'
        + '<b style="font-size:13.5px">虚拟员工</b>'
        + '<span class="dim" style="font-size:12px">只显示当前在线的设备（5 分钟内有心跳）；离线设备不列出</span>'
        + '<span class="grow"></span>'
        + '<span class="tag ' + (d.online_count ? "ok" : "") + '"><span class="dot"></span>' + (d.online_count || 0) + ' 台在线</span>'
        + (d.discovered ? '<span class="tag cy">新发现 ' + d.discovered + ' 台</span>' : '')
        + '</div><div class="dim" style="font-size:12px;margin-top:8px">派活会经主站定时任务链路下发到该设备，执行结果可回读。设备离线时不会出现在这里。</div></div>'
        + (AI_CACHE.length ? '<div class="g3">' + AI_CACHE.map(aiCard).join("") + '</div>'
                           : '<div class="glass card"><div class="dim">当前没有在线设备。让对方打开客户端（保持在线）后点「刷新」；离线设备不列出。</div></div>');
      $$("#s-ai [data-aedit]").forEach(function(b){ b.addEventListener("click", function(){ openAiEditor(Number(b.dataset.aedit)); }); });
      $$("#s-ai [data-adel]").forEach(function(b){
        b.addEventListener("click", function(){
          api("/api/manage/ai-employees/" + b.dataset.adel, { method: "DELETE" })
            .then(function(){ toast("已移除"); loadAi(); }).catch(function(e){ toast(e.message, true); });
        });
      });
    }).catch(function(e){ showErr(e.message); });
  }

  function openAiEditor(id){
    var a = AI_CACHE.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    var picked = {};
    (a.capabilities || []).forEach(function(c){ picked[c] = true; });
    var chips = CAP_LIST.map(function(c){
      return '<button class="btn sm ' + (picked[c] ? "" : "ghost") + '" data-cap="' + c + '" style="margin:0 6px 6px 0">' + c + '</button>';
    }).join("");
    openDrawer("虚拟员工 · 配置", a.name,
      '<div class="dsec"><h4>名称</h4><input id="aiName" value="' + a.name + '" /></div>'
      + '<div class="dsec"><h4>能力（勾选后派活会带上）</h4>' + chips + '</div>'
      + '<div class="dsec"><h4>设备</h4>'
      + '<div class="mline"><span class="nm">槽位</span><span class="mut" style="word-break:break-all">' + a.installation_id + '</span></div>'
      + '<div class="mline"><span class="nm">归属</span><span class="mut">' + (a.owner_name || "—") + '</span></div>'
      + '<div class="mline"><span class="nm">状态</span><span class="mut">' + (a.online ? "在线" : "离线（上线后自动领取任务）") + '</span></div></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="aiCancel">取消</button>'
      + '<button class="btn sm" id="aiOk">保存</button></div>');
    $$("#dBody [data-cap]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = b.dataset.cap;
        if (picked[c]) { delete picked[c]; b.className = "btn sm ghost"; }
        else { picked[c] = true; b.className = "btn sm"; }
      });
    });
    document.getElementById("aiCancel").addEventListener("click", closeDrawer);
    document.getElementById("aiOk").addEventListener("click", function(){
      api("/api/manage/ai-employees/" + a.id, { method: "PATCH", body: {
        name: document.getElementById("aiName").value.trim(),
        capabilities: Object.keys(picked) } })
        .then(function(){ closeDrawer(); toast("已保存"); loadAi(); })
        .catch(function(e){ toast(e.message, true); });
    });
  }

  /* ================= 工作记录 ================= */
  function loadWorklogs(){
    api("/api/manage/worklogs?company_id=" + ACTIVE + "&limit=12").then(function(d){
      var rows = d.worklogs || [];
      var box = document.getElementById("wlList");
      if (!box) return;
      box.innerHTML = rows.length ? rows.map(function(r){
        return '<div class="mline"><span class="nm" style="flex:1">'
          + '<b style="font-size:12.5px">' + r.author + '</b>'
          + '<span class="mut" style="margin-left:8px">' + r.content + '</span></span>'
          + (r.minutes ? '<span class="dim num">' + r.minutes + '′</span>' : '')
          + '<span class="dim num">' + r.worked_on + '</span></div>';
      }).join("") : '<div class="dim" style="font-size:12.5px">还没有工作记录</div>';
    }).catch(function(){});
  }
  function submitWorklog(){
    var el = document.getElementById("wlText");
    var text = ((el && el.value) || "").trim();
    if (!text) return toast("写点内容再提交", true);
    var minEl = document.getElementById("wlMin");
    api("/api/manage/worklogs", { method: "POST", body: {
      company_id: ACTIVE, content: text, minutes: Number((minEl && minEl.value) || 0) } })
      .then(function(){ el.value = ""; toast("已提交"); loadWorklogs(); })
      .catch(function(e){ toast(e.message, true); });
  }

  /* ---------- 初始化 ---------- */
  if (localStorage.getItem("manage_login_mode") === "admin"){ setLoginMode("admin"); }
  if (TOKEN){
    bootApp().catch(function(){ /* 已在 bootApp 里提示 */ });
  } else {
    fetch("/api/manage/health").catch(function(){});
  }
})();
</script>
</body>
</html>
