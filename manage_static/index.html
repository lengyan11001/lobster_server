<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MANAGE · 项目管理与 AI 赋能</title>
<style>
:root{
  --bg:#05070f; --ink:#f2f6ff; --muted:#b6c1d2; --dim:#8b98ae;
  --w-glass:rgba(255,255,255,.045); --w-line:rgba(255,255,255,.10); --w-line2:rgba(255,255,255,.22);
  --accent:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --ease:cubic-bezier(.22,1,.36,1); --slow:26s; --slower:34s;
  --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:400 14.5px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8fb7ff;text-decoration:none}
.hide{display:none!important}
/* 背景 */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 12% -10%,#0d1930 0,transparent 60%),radial-gradient(90% 80% at 100% 0,#161033 0,transparent 55%),linear-gradient(180deg,#04060d,#070c18 60%,#04060d)}
.bg video,.bg .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg .poster{opacity:.9;animation:imgDrift var(--slower) var(--ease) infinite alternate;transition:opacity 1.2s var(--ease)}
@keyframes imgDrift{from{transform:scale(1.04)}to{transform:scale(1.12) translate3d(-1.2%,-1%,0)}}
.aurora{position:absolute;border-radius:50%;filter:blur(110px);mix-blend-mode:screen;opacity:.45}
.a1{width:70vw;height:70vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(34,211,238,.5),transparent 60%);animation:drift1 var(--slow) var(--ease) infinite alternate}
.a2{width:60vw;height:60vw;right:-14vw;top:-10vw;background:radial-gradient(circle,rgba(99,102,241,.45),transparent 60%);animation:drift2 var(--slow) var(--ease) infinite alternate;animation-delay:-8s}
@keyframes drift1{to{transform:translate3d(4vw,2vw,0) scale(1.16)}}
@keyframes drift2{to{transform:translate3d(-5vw,3vw,0) scale(1)}}
.veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 120%,rgba(5,7,15,.98) 0,rgba(5,7,15,.7) 42%,transparent 72%),linear-gradient(180deg,rgba(5,7,15,.6),rgba(5,7,15,.25) 40%,rgba(5,7,15,.95))}
.grid{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(100% 70% at 50% 0,#000,transparent 72%);mask-image:radial-gradient(100% 70% at 50% 0,#000,transparent 72%)}
.glass{background:rgba(11,16,28,.62);border:1px solid var(--w-line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px}
.glass.card{padding:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}.dim{color:var(--dim)}
body{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--w-line);color:var(--muted);background:rgba(255,255,255,.03)}
.tag.ok{border-color:rgba(52,211,153,.45);color:#6ee7b7;background:rgba(52,211,153,.08)}
.tag.wn{border-color:rgba(251,191,36,.45);color:#fcd34d;background:rgba(251,191,36,.08)}
.tag.bd{border-color:rgba(251,113,133,.45);color:#fda4af;background:rgba(251,113,133,.08)}
.tag.cy{border-color:rgba(34,211,238,.45);color:#7fe6f7;background:rgba(34,211,238,.08)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.btn{height:38px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;font-size:13.5px;font-weight:600;color:#04121a;background:linear-gradient(100deg,#67e8f9,#818cf8 60%,#c084fc);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 36px -16px rgba(34,211,238,.9)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--w-line2);color:var(--ink);font-weight:500}
.btn.ghost:hover{border-color:var(--accent);color:#a5f4fb;box-shadow:none}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:9px}
input,select,textarea{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--w-line);border-radius:11px;color:var(--ink);padding:0 11px;height:38px;font:inherit;font-size:13px;outline:none;transition:all .3s var(--ease)}
textarea{height:auto;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#8b98ae 50%),linear-gradient(135deg,#8b98ae 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:#0b1220;color:#e9effb}
label.fl{display:block;font-size:11.5px;color:var(--dim);margin:0 0 6px 2px}
/* Landing */
#landing{position:relative;z-index:3;min-height:100dvh;display:flex;flex-direction:column;padding:0 6vw 30px}
nav.top{display:flex;align-items:center;gap:14px;height:64px;margin-top:14px;padding:0 16px;animation:rise 1.1s var(--ease) both .1s}
nav.top .logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:700 12px var(--mono);color:#06121c;background:conic-gradient(from 130deg,#22d3ee,#6366f1,#a855f7,#22d3ee);box-shadow:0 0 22px rgba(34,211,238,.45)}
nav.top .nm{font-size:14px;font-weight:600;letter-spacing:.14em}
nav.top .grow,.grow{flex:1}
nav.top .links{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.hero{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vw;align-items:center;padding:5vh 0 2vh}
.eyebrow{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--w-line);background:var(--w-glass);color:var(--muted);font-size:12px;animation:rise 1.1s var(--ease) both .18s}
h1{margin:22px 0 0;font-size:clamp(32px,4.2vw,58px);line-height:1.08;font-weight:650;letter-spacing:-.02em;animation:rise 1.3s var(--ease) both .28s}
h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 34px rgba(34,211,238,.55)}
.sub{margin:18px 0 0;max-width:44ch;color:var(--muted);font-size:15.5px;line-height:1.8;animation:rise 1.3s var(--ease) both .42s}
.btns{display:flex;gap:12px;margin-top:28px;animation:rise 1.3s var(--ease) both .56s}
.btns .btn{height:48px;padding:0 24px;font-size:15px;border-radius:14px}
.winwrap{position:relative}
.win{border-radius:16px;overflow:hidden;background:rgba(10,14,26,.72);border:1px solid var(--w-line);box-shadow:0 50px 120px -40px rgba(0,0,0,.95);animation:rise 1.5s var(--ease) both .5s,floatY 18s ease-in-out infinite 2s}
@keyframes floatY{0%,100%{transform:translateY(0) rotateX(2deg) rotateY(-6deg)}50%{transform:translateY(-14px) rotateX(1deg) rotateY(-4deg)}}
.win .bar{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-bottom:1px solid var(--w-line);background:rgba(255,255,255,.03)}
.win .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.win .bar .url{margin-left:8px;flex:1;height:19px;border-radius:6px;background:rgba(255,255,255,.05);font:500 11px var(--mono);color:var(--dim);display:flex;align-items:center;padding:0 9px}
.win img{display:block;width:100%}
.chip{position:absolute;display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:14px;background:rgba(10,14,26,.66);border:1px solid var(--w-line);backdrop-filter:blur(18px);font-size:12px;white-space:nowrap}
.chip .t{color:var(--muted);font-size:10.5px}
.chip .v{font-family:var(--mono);font-size:12.5px}
.c1{left:-4%;bottom:12%;animation:rise 1.4s var(--ease) both .9s,floatY 22s ease-in-out infinite 2s}
.c2{right:3%;top:-5%;animation:rise 1.4s var(--ease) both 1.05s,floatY 26s ease-in-out infinite 3s}
.rise{animation:rise 1.2s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fadein{animation:fade .6s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 登录面板 */
#loginBox{margin-top:26px;max-width:400px;padding:22px;animation:rise 1.1s var(--ease) both .2s}
#loginBox h3{margin:0 0 16px;font-size:16px}
.err{color:#fda4af;font-size:12.5px;margin-top:10px;min-height:16px}
/* App */
#app{position:relative;z-index:3;min-height:100dvh;display:grid;grid-template-columns:74px 1fr;padding:12px}
.rail{margin-right:12px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:22px}
.rail .logo{width:38px;height:38px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center;font:700 14px var(--mono);color:#06121c;background:conic-gradient(from 130deg,#22d3ee,#6366f1,#a855f7,#22d3ee)}
.rail button{width:50px;height:50px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;gap:2px;font-size:9.5px;transition:all .3s var(--ease)}
.rail button .ic{font-size:16px}
.rail button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.rail button.on{color:#0a1520;background:linear-gradient(140deg,#7dd3fc,#a5b4fc)}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar h2{margin:0;font-size:16px}
.topbar .sub{font-size:12px;color:var(--dim);margin:0}
.view{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.hero{grid-template-columns:1fr;gap:28px}.winwrap{order:-1}}
.kpi .t{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font-size:26px;font-weight:600;margin:8px 0 4px}
.row{display:flex;gap:12px;align-items:flex-start}
table.tb{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:12.5px}
.tb th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;padding:0 10px 2px}
.tb td{background:rgba(255,255,255,.028);padding:9px 10px;border-top:1px solid var(--w-line);border-bottom:1px solid var(--w-line)}
.tb td:first-child{border-left:1px solid var(--w-line);border-radius:11px 0 0 11px}
.tb td:last-child{border-right:1px solid var(--w-line);border-radius:0 11px 11px 0}
.right{text-align:right}
.clickable{cursor:pointer}
.miss{color:#fcd34d}
#mask{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
#mask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,97vw);z-index:51;transform:translateX(102%);transition:transform .52s var(--ease);display:flex;flex-direction:column;border-radius:0;border-right:0;overflow:hidden}
#drawer.on{transform:none}
.dhead{padding:16px 18px 12px;display:flex;gap:12px;align-items:flex-start}
.dbody{flex:1;overflow:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:12px}
.dsec{border:1px solid var(--w-line);border-radius:14px;padding:13px 14px;background:rgba(255,255,255,.028)}
.dsec h4{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.mline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.07);font-size:13px}
.mline:last-child{border-bottom:0}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden;flex:0 0 110px}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#22d3ee,#818cf8)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;padding:11px 18px;border-radius:12px;background:rgba(10,14,26,.92);border:1px solid var(--w-line);font-size:13px;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}

/* ---------- 计划脑图 ---------- */
.mmwrap{position:relative;width:100%;min-height:340px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 90% at 8% 0%,rgba(34,211,238,.07),transparent 60%),
             radial-gradient(90% 80% at 100% 100%,rgba(168,85,247,.07),transparent 60%),
             rgba(255,255,255,.015);
  border:1px solid var(--w-line)}
.mmsvg{position:absolute;left:0;top:0;pointer-events:none}
.mmnode{position:absolute;transform:translateY(-50%) scale(.9);opacity:0;
  transition:opacity .45s var(--ease),transform .5s var(--ease);
  padding:5px 10px;border-radius:10px;border:1px solid var(--w-line);
  background:rgba(14,20,34,.94);font-size:12px;line-height:1.25;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mmnode.on{opacity:1;transform:translateY(-50%) scale(1)}
.mmnode:hover{border-color:var(--w-line2);background:rgba(24,33,54,.98)}
.mmnode.root{border-color:rgba(34,211,238,.65);color:#a5f4fb;font-weight:600;
  box-shadow:0 0 24px -6px rgba(34,211,238,.8)}
.mmnode.phase{border-color:rgba(129,140,248,.55);color:#c7d2fe;font-weight:600}
.mmnode.task.ok{border-color:rgba(52,211,153,.45)}
.mmnode.task.miss{border-color:rgba(251,191,36,.55);color:#fcd34d}
</style>
</head>
<body>

<div class="bg">
  <video id="bgv" autoplay muted loop playsinline preload="auto" poster="media/hero.png">
    <source src="media/hero-loop.mp4" type="video/mp4" />
  </video>
  <img class="poster" id="poster" src="media/hero.png" alt="" />
  <div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="grid"></div>
  <div class="veil"></div>
</div>

<!-- ================= 落地页 ================= -->
<div id="landing">
  <nav class="top glass">
    <span class="logo">M</span><span class="nm">MANAGE</span>
    <span class="dim" style="font-size:12px;margin-left:6px">内部系统 · 登录后使用</span>
    <span class="grow"></span>
    <button class="btn sm ghost" id="toLogin">登录</button>
  </nav>

  <div class="hero">
    <div>
      <span class="eyebrow"><span class="dot" style="color:var(--accent)"></span>AI 每天 09:00 / 17:00 自动体检项目</span>
      <h1>让每个项目<br /><em>真的做成</em></h1>
      <p class="sub">老板只输入目标，AI 排出阶段、任务、责任人、要求与时间节点；
      判断资源不够时，它会主动告诉你该招谁、该加什么。</p>
      <div class="btns">
        <button class="btn" id="ctaLogin">进入工作台</button>
        <button class="btn ghost" id="ctaDemo">看一次规划演示</button>
      </div>

      <div id="loginBox" class="glass">
        <h3>登录</h3>
        <div style="display:flex;gap:6px;margin-bottom:14px">
          <button class="btn sm" id="modeUser" style="flex:1">普通账号</button>
          <button class="btn sm ghost" id="modeAdmin" style="flex:1">平台管理员</button>
        </div>
        <div style="margin-bottom:10px">
          <label class="fl" id="accLabel">账号 / 手机号</label>
          <input id="acc" placeholder="邮箱 / 手机号" autocomplete="username" />
        </div>
        <div>
          <label class="fl">密码</label>
          <input id="pwd" type="password" placeholder="密码" autocomplete="current-password" />
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
          <button class="btn" id="doLogin" style="flex:1">登录</button>
        </div>
        <div class="err" id="loginErr"></div>
        <div class="dim" style="font-size:11.5px" id="loginHint">与 AI 员工客户端同一套账号体系</div>
      </div>
    </div>

    <div class="winwrap">
      <div class="win">
        <div class="bar"><i></i><i></i><i></i><span class="url">manage.bhzn.top</span></div>
        <img src="media/shot-dashboard.png" alt="manage 工作台" />
      </div>
      <div class="chip c1"><span class="dot" style="color:var(--accent)"></span><span><span class="t">AI 日检</span><br /><span class="v">09:00 · 17:00</span></span></div>
      <div class="chip c2"><span class="dot" style="color:var(--accent)"></span><span><span class="t">达成条件</span><br /><span class="v" id="chipCond">— 项待补位</span></span></div>
    </div>
  </div>
</div>

<!-- ================= 应用 ================= -->
<div id="app" class="hide">
  <aside class="rail glass">
    <div class="logo">M</div>
    <button data-go="s-brief" class="on"><span class="ic">◈</span>简报</button>
    <button data-go="s-proj"><span class="ic">✧</span>项目</button>
    <button data-go="s-org"><span class="ic">◍</span>组织</button>
    <button data-go="s-prod"><span class="ic">▦</span>产品</button>
    <button data-go="s-cond"><span class="ic">✦</span>条件</button>
    <button data-go="s-fin"><span class="ic">◎</span>财务</button>
  </aside>
  <div class="main">
    <div class="topbar glass">
      <div>
        <h2 id="pgTitle">经营简报</h2>
        <p class="sub" id="pgSub">—</p>
      </div>
      <span class="grow"></span>
      <select id="companySel" style="width:210px"></select>
      <button class="btn sm ghost" id="reload">↻ 刷新</button>
      <span class="chip" style="position:static" id="userChip">—</span>
      <button class="btn sm ghost" id="logout">退出</button>
    </div>
    <div class="view">
      <div id="errBox" class="glass card hide" style="border-color:rgba(251,113,133,.5);color:#fda4af"></div>

      <section id="s-brief" class="view"></section>
      <section id="s-proj" class="view hide"></section>
      <section id="s-org" class="view hide"></section>
      <section id="s-prod" class="view hide"></section>
      <section id="s-cond" class="view hide"></section>
      <section id="s-fin" class="view hide"></section>
    </div>
  </div>
</div>

<div id="mask"></div>
<aside id="drawer" class="glass">
  <div class="dhead">
    <div style="flex:1">
      <div class="dim" id="dKind" style="font-size:11px;letter-spacing:.08em">—</div>
      <div id="dTitle" style="font-size:15.5px;font-weight:600;margin-top:5px">—</div>
    </div>
    <button class="btn sm ghost" id="dClose">关闭</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var TOKEN = localStorage.getItem("manage_token") || "";
  var ME = null, COMPANIES = [], ACTIVE = null, ROLES = {};
  var CHECKUP = { slot: "1700", items: [] };

  /* ---------- 背景视频 ---------- */
  (function bg(){
    var v = document.getElementById("bgv"), p = document.getElementById("poster");
    p.style.opacity = ".9";
    function ok(){ v.style.display = "block"; v.style.opacity = "1"; p.style.opacity = "0"; v.play().catch(function(){}); }
    function no(){ v.style.display = "none"; p.style.opacity = ".9"; }
    v.addEventListener("loadeddata", function(){ if (v.videoWidth) ok(); else no(); }, { once:true });
    v.addEventListener("error", no, { once:true });
    setTimeout(function(){ if (!v.videoWidth) no(); }, 3000);
  })();

  function toast(msg, bad){
    var t = $("#toast");
    t.textContent = msg;
    t.style.borderColor = bad ? "rgba(251,113,133,.6)" : "var(--w-line)";
    t.classList.add("on");
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
  }
  function showErr(msg){
    var b = $("#errBox");
    if (!msg){ b.classList.add("hide"); return; }
    b.textContent = msg; b.classList.remove("hide");
  }
  function openDrawer(kind, title, html){

  function api(path, opts){
    opts = opts || {};
    var headers = { "Accept":"application/json" };
    if (opts.body !== undefined) headers["Content-Type"] = "application/json";
    if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
    return fetch(path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
    }).then(function(r){
      return r.text().then(function(text){
        var data = {};
        try { data = text ? JSON.parse(text) : {}; } catch(e){ data = { detail: text }; }
        if (!r.ok){
          var detail = data && data.detail;
          if (Array.isArray(detail)) detail = detail.map(function(d){ return d.msg || JSON.stringify(d); }).join("; ");
          throw new Error(detail || ("HTTP " + r.status));
        }
        return data;
      });
    });
  }

    var acc = $("#acc").value.trim(), pwd = $("#pwd").value;

    $("#loginErr").textContent = "";
    if (!acc || !pwd){ $("#loginErr").textContent = "请填写账号与密码"; return; }
    btn.disabled = true; btn.textContent = "登录中…";
    var isA = LOGIN_MODE === "admin";
    var path = isA ? "/api/manage/admin/login" : "/auth/login-phone-password";
    var body = isA ? { username: acc, password: pwd } : { account: acc, password: pwd };
    api(path, { method:"POST", body: body })
      .then(function(res){
        var token = res.access_token || res.token || "";
        if (!token) throw new Error("登录返回异常");
        TOKEN = token; localStorage.setItem("manage_token", token);
        localStorage.setItem("manage_login_mode", LOGIN_MODE);
        return bootApp();

      .catch(function(e){ $("#loginErr").textContent = e.message || "登录失败"; })
      .then(function(){ btn.disabled = false; btn.textContent = "登录"; });

  function mountMindmap(){
    var host = document.getElementById("mm");
    if (!host) return;
    var p = PROJ_CTX.project, nodes = PROJ_CTX.nodes, pid = PROJ_CTX.pid;
    var phases = nodes.filter(function(n){ return n.node_type === "phase"; });
    var tasks = nodes.filter(function(n){ return n.node_type === "task"; });
    var W = Math.max(320, host.clientWidth || 700);
    var rowH = 34, gap = 22, pad = 18;
    var blocks = [], cursor = pad;
    phases.forEach(function(ph){
      var kids = tasks.filter(function(t){ return t.parent_id === ph.id; });
      var h = Math.max(1, kids.length) * rowH;
      blocks.push({ ph: ph, kids: kids, y0: cursor, h: h });
      cursor += h + gap;
    });
    var orphans = tasks.filter(function(t){
      return !t.parent_id || !phases.some(function(x){ return x.id === t.parent_id; }); });
    if (orphans.length){
      blocks.push({ ph: { id: 0, title: "未归入阶段" }, kids: orphans, y0: cursor, h: orphans.length * rowH });
      cursor += orphans.length * rowH + gap;
    }
    var H = Math.max(300, cursor + pad);
    host.style.height = H + "px";

    var xRoot = 8, xPhase = Math.round(W * 0.28), xTask = Math.round(W * 0.50);
    var wRoot = Math.round(W * 0.20), wPhase = Math.round(W * 0.20), wTask = W - xTask - 10;
    var items = [{ id: "__root", cls: "root", x: xRoot, y: H / 2, w: wRoot, label: p.name }];
    var edges = [];
    blocks.forEach(function(b){
      var cy = b.y0 + b.h / 2;
      items.push({ id: "p" + b.ph.id, nodeId: b.ph.id, cls: "phase", x: xPhase, y: cy, w: wPhase,
                   label: b.ph.title + " · " + b.kids.length + " 项" });
      edges.push(["__root", "p" + b.ph.id]);
      b.kids.forEach(function(k, i){
        var y = b.y0 + i * rowH + rowH / 2;
        items.push({ id: "t" + k.id, nodeId: k.id,
                     cls: "task " + (k.complete ? "ok" : "miss"), x: xTask, y: y, w: wTask,
                     label: k.title + " ｜ " + (k.owner_name || "待指派") });
        edges.push(["p" + b.ph.id, "t" + k.id]);
      });
    });

    var pos = {};
    items.forEach(function(it){ pos[it.id] = it; });
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "mmsvg");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var paths = [];
    edges.forEach(function(e){
      var a = pos[e[0]], b = pos[e[1]];
      if (!a || !b) return;
      var x1 = a.x + a.w, y1 = a.y, x2 = b.x, y2 = b.y, mx = (x1 + x2) / 2;
      var pa = document.createElementNS(NS, "path");
      pa.setAttribute("d", "M" + x1 + " " + y1 + " C" + mx + " " + y1 + "," + mx + " " + y2 + "," + x2 + " " + y2);
      pa.setAttribute("stroke", e[1].charAt(0) === "t" ? "rgba(129,140,248,.42)" : "rgba(34,211,238,.55)");
      pa.setAttribute("fill", "none");
      pa.setAttribute("stroke-width", "1.2");
      var len = 160;
      try { len = Math.max(40, pa.getTotalLength()); } catch (err) {}
      pa.style.strokeDasharray = len;
      pa.style.strokeDashoffset = len;
      pa.style.transition = "stroke-dashoffset .6s var(--ease)";
      svg.appendChild(pa);
      paths.push(pa);
    });
    host.appendChild(svg);
    var els = [];
    items.forEach(function(it){
      var d = document.createElement("div");
      d.className = "mmnode " + it.cls;
      d.style.left = it.x + "px";
      d.style.top = it.y + "px";
      d.style.width = it.w + "px";
      d.textContent = it.label;
      d.title = it.label;
      if (it.nodeId){
        d.addEventListener("click", function(){
          var cur = PROJ_CTX.nodes;
          openNodeEditor(it.nodeId, cur, pid);
        });
      }
      host.appendChild(d);
      els.push(d);
    });
    els.forEach(function(el, i){ setTimeout(function(){ el.classList.add("on"); }, 50 + i * 65); });
    paths.forEach(function(pa, i){ setTimeout(function(){ pa.style.strokeDashoffset = 0; }, 50 + i * 65); });
  }

  var PROJ_CTX = { project: null, nodes: [], pid: 0 };

  var NODE_STATUS = { not_started:["未开始",""], in_progress:["进行中","wn"], completed:["完成","ok"], blocked:["受阻","bd"] };

  function openProject(pid){
    api("/api/manage/projects/" + pid).then(function(d){
      var p = d.project, nodes = d.nodes || [];
      var phases = nodes.filter(function(n){ return n.node_type === "phase"; });
      var tasks = nodes.filter(function(n){ return n.node_type === "task"; });
      var milestones = nodes.filter(function(n){ return n.node_type === "milestone"; });
      var arr = phases.concat(tasks);
      var doneN = arr.filter(function(n){ return n.complete; }).length;
      var pendingN = arr.length - doneN;
      var filter = "all";
      var folded = {};
      var view = "list";

      function tagOf(n){
        var st = NODE_STATUS[n.status] || ["未开始",""];
        return '<span class="tag ' + st[1] + '" style="flex:0 0 auto">' + st[0] + '</span>';
      }
      function taskCard(n){
        var miss = !n.complete;
        var owner = n.owner_name
          ? '<span class="mchip"><b>' + n.owner_name + '</b></span>'
          : '<span class="mchip warn">待指派</span>';
        var req = n.requirement
          ? '<span class="mchip req" title="' + String(n.requirement).replace(/"/g,"&quot;") + '">要求：' + n.requirement + '</span>'
          : '<span class="mchip warn">待填写要求</span>';
        var tm = (n.start_at && n.end_at)
          ? '<span class="mchip tm">' + n.start_at + ' ~ ' + n.end_at + '</span>'
          : '<span class="mchip warn">时间待定</span>';
        return '<div class="atask' + (miss ? " miss" : "") + '" data-node="' + n.id + '">'
          + '<div class="l1"><span class="ttl">' + n.title + '</span>' + tagOf(n)
          + '<span class="act"><button class="btn sm ghost" data-edit="' + n.id + '">编辑</button></span></div>'
          + '<div class="l2">' + owner + req + tm + '</div></div>';
      }
      function phaseBlock(ph, idx){
        var kids = tasks.filter(function(t){ return t.parent_id === ph.id; });
        var kidDone = kids.filter(function(t){ return t.complete; }).length;
        var isFold = !!folded[ph.id];
        var body = kids.length
          ? kids.map(taskCard).join("")
          : '<div class="dim" style="font-size:12px;padding:4px 2px">该阶段还没有任务</div>';
        return '<div class="aphase' + (isFold ? " fold" : "") + '" data-phase="' + ph.id + '">'
          + '<div class="ph" data-fold="' + ph.id + '"><span class="mk">◈</span>'
          + '<span class="ttl">' + ph.title + '</span>'
          + '<span class="rg">' + (ph.start_at || "?") + ' ~ ' + (ph.end_at || "?") + '</span>'
          + '<span class="grow"></span>'
          + '<span class="cnt">' + kidDone + '/' + kids.length + ' 任务</span>'
          + '<span class="cv">▼</span></div>'
          + '<div class="ptasks">' + body + '</div></div>';
      }
      function orphanBlock(){
        var kids = tasks.filter(function(t){
          return !t.parent_id || !phases.some(function(x){ return x.id === t.parent_id; }); });
        if (!kids.length) return "";
        return '<div class="aphase"><div class="ph"><span class="mk">◈</span>'
          + '<span class="ttl">未归入阶段的任务</span><span class="grow"></span>'
          + '<span class="cnt">' + kids.length + ' 任务</span><span class="cv">▼</span></div>'
          + '<div class="ptasks">' + kids.map(taskCard).join("") + '</div></div>';
      }
      function msBlock(){
        if (!milestones.length) return "";
        return '<div class="aphase"><div class="ph"><span class="mk">◆</span>'
          + '<span class="ttl">里程碑</span><span class="grow"></span>'
          + '<span class="cnt">' + milestones.length + '</span><span class="cv">▼</span></div>'
          + '<div class="ptasks">' + milestones.map(function(m){
              return '<div class="msline"><span style="flex:1">' + m.title + '</span>'
                + '<span class="mchip tm">' + (m.start_at || "待定") + '</span></div>'; }).join("") + '</div></div>';
      }
      function match(n){
        if (filter === "pending") return !n.complete;
        if (filter === "unassigned") return !n.owner_name;
        if (filter === "ready") return n.complete;
        return true;
      }
      function renderBody(){
        if (!arr.length){
          return '<div class="dim" style="font-size:12.5px;padding:10px 2px">还没有规划。点下面「AI 生成规划」开始。</div>';
        }
        if (filter === "all"){
          return phases.map(phaseBlock).join("") + orphanBlock() + msBlock();
        }
        var picked = tasks.filter(match);
        if (!picked.length) return '<div class="dim" style="font-size:12.5px;padding:10px 2px">没有符合条件的任务。</div>';
        return '<div class="ptasks">' + picked.map(taskCard).join("") + '</div>';
      }
      function bind(){
        $$("#dBody [data-edit]").forEach(function(b){
          b.addEventListener("click", function(e){ e.stopPropagation(); openNodeEditor(Number(b.dataset.edit), nodes, pid); });
        });
        $$("#dBody [data-fold]").forEach(function(h){
          h.addEventListener("click", function(){
            var id = Number(h.dataset.fold);
            folded[id] = !folded[id];
            h.parentNode.classList.toggle("fold", !!folded[id]);
          });
        });
        $$("#dBody [data-filter]").forEach(function(b){
          b.addEventListener("click", function(){ filter = b.dataset.filter; draw(); });
        });
      }
      function draw(){
        PROJ_CTX = { project: p, nodes: nodes, pid: pid };
        var stTag = p.arrangement_status === "confirmed" ? '<span class="tag ok">已确认</span>'
                  : (p.arrangement_status === "changed" ? '<span class="tag wn">有待确认变更</span>' : '<span class="tag">草稿</span>');
        var head = '<div class="dsec"><h4>项目</h4>'
          + '<div style="font-size:13.5px;line-height:1.7">' + (p.goal || "—") + '</div>'
          + '<div class="dim" style="font-size:11.5px;margin-top:7px">' + (p.start_at||"") + ' → ' + (p.end_at||"")
          + ' · 来源 ' + (p.plan_source || "未规划") + ' · ' + phases.length + ' 阶段 / ' + tasks.length + ' 任务</div>'
          + '<div style="margin-top:9px">' + stTag
          + (pendingN ? '<span class="tag wn" style="margin-left:6px">' + pendingN + ' 项待补</span>'
                      : '<span class="tag ok" style="margin-left:6px">已排齐</span>') + '</div></div>';
        var tabs = '<div class="arrbar" style="margin-bottom:10px">'
          + ['list:列表', 'mind:脑图'].map(function(x){
              var kv = x.split(":");
              return '<button class="btn sm ' + (view === kv[0] ? "" : "ghost") + '" data-view="' + kv[0] + '">' + kv[1] + '</button>';
            }).join("")
          + '<span class="grow"></span><span class="dim" style="font-size:11.5px">'
          + (view === "mind" ? "点节点即可编辑；按阶段自动分支" : "点阶段标题可折叠") + '</span></div>';
        var filters = ['all:全部', 'pending:待补', 'unassigned:仅未指派', 'ready:已排齐'].map(function(x){
              var kv = x.split(":");
              return '<button class="btn sm ' + (filter === kv[0] ? "" : "ghost") + '" data-filter="' + kv[0] + '">' + kv[1] + '</button>';
            }).join("");
        var bar = '<div class="dsec"><h4>工作安排（人员 · 要求 · 时间节点）</h4>'
          + '<div class="arrsum" style="margin-bottom:10px">'
          + '<span>已排齐 <b style="color:var(--ink)">' + doneN + '/' + arr.length + '</b></span>'
          + '<span class="pbar"><i style="width:' + (arr.length ? Math.round(doneN/arr.length*100) : 0) + '%"></i></span>'
          + '<span class="dim">' + (arr.length ? Math.round(doneN/arr.length*100) + '%' : "—") + '</span></div>'
          + tabs
          + (view === "mind"
              ? '<div id="mm" class="mmwrap"></div>'
              : '<div class="arrbar" style="margin-bottom:11px">' + filters + '</div><div id="arrBody">' + renderBody() + '</div>')
          + '</div>';
        var actions = '<div class="row" style="gap:9px;flex-wrap:wrap;justify-content:flex-end">'
          + '<button class="btn sm ghost" id="planTpl">用模板生成</button>'
          + '<button class="btn sm" id="planAi">AI 生成规划</button>'
          + '<button class="btn sm ghost" id="saveDraft">存草稿</button>'
          + '<button class="btn sm" id="confirmArr">确认安排</button></div>';
        openDrawer("项目 · 工作安排", p.name, head + bar + actions);
        bind();
        $$("#dBody [data-view]").forEach(function(b){
          b.addEventListener("click", function(){ view = b.dataset.view; draw(); });
        });
        if (view === "mind"){ mountMindmap(); }
        $("#saveDraft").addEventListener("click", function(){
          api("/api/manage/projects/"+pid+"/draft", { method:"POST", body:{ payload:{ saved_at:new Date().toISOString() } } })
            .then(function(){ toast("草稿已保存"); loadProjects(); })
            .catch(function(e){ toast(e.message, true); });
        });
        $("#confirmArr").addEventListener("click", function(){
          api("/api/manage/projects/"+pid+"/confirm", { method:"POST" })
            .then(function(){ toast("安排已确认"); closeDrawer(); loadProjects(); loadBrief(); })
            .catch(function(e){ toast(e.message, true); });
        });
        function runPlan(mode, btn){
          btn.disabled = true; var old = btn.textContent; btn.textContent = "生成中…";
          api("/api/manage/projects/"+pid+"/plan", { method:"POST", body:{ mode: mode } })
            .then(function(res){ toast("已生成（来源 " + res.source + "）"); openProject(pid); loadBrief(); loadProjects(); })
            .catch(function(e){ toast(e.message, true); })
            .then(function(){ btn.disabled = false; btn.textContent = old; });
        }
        $("#planAi").addEventListener("click", function(){ runPlan("ai", this); });
        $("#planTpl").addEventListener("click", function(){ runPlan("template", this); });
      }
      draw();
    }).catch(function(e){ toast(e.message, true); });
  }

      + '<div class="dsec"><h4>人员</h4><label class="fl">责任人</label>'
      + '<input id="edOwner" value="'+(n.owner_name||"")+'" placeholder="姓名（可填虚拟员工）" style="margin-bottom:10px" />'
      + '<label class="fl">状态</label><select id="edStatus">'
      + ["not_started","in_progress","completed","blocked"].map(function(s){
          var label = {not_started:"未开始",in_progress:"进行中",completed:"完成",blocked:"受阻"}[s];

      + '<div style="flex:1"><label class="fl">结束</label><input id="edEnd" value="'+(n.end_at||"")+'" placeholder="2026-10-05" /></div></div></div>'

      + '<div style="display:flex;gap:10px;margin-bottom:10px">'
      + '<div style="flex:1"><label class="fl">部门</label><input id="eDept" value="' + (m ? (m.dept||"") : "") + '" /></div>'
      + '<div style="flex:0 0 110px"><label class="fl">负载 %</label><input id="eLoad" value="' + (m ? m.load : 0) + '" /></div></div>'
      + '<label class="fl">备注</label><input id="eRemark" value="' + (m ? (m.remark||"") : "") + '" placeholder="基本情况描述" /></div>'
      + '<div class="dsec"><h4>岗位（可多选 · 每个岗位单独设级别）</h4>' + roleRows + '</div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="eCancel">取消</button>'
      + '<button class="btn sm" id="eSave">' + (m ? "保存" : "添加") + '</button></div>';
    openDrawer(m ? "组织架构 · 编辑成员" : "组织架构 · 添加成员", m ? m.name : "新增成员", html);
    $$("#dBody [data-role]").forEach(function(b){
      b.addEventListener("click", function(){
        var code = b.dataset.role;
        if (picked[code]) { delete picked[code]; b.className = "btn sm ghost"; }
        else { picked[code] = "p2"; b.className = "btn sm"; }
        b.style.flex = "1"; b.style.justifyContent = "flex-start";
        var sel = document.querySelector('#dBody [data-rlevel="' + code + '"]');
        if (sel) { sel.disabled = !picked[code]; }
      });
    });
    document.getElementById("eCancel").addEventListener("click", closeDrawer);
    document.getElementById("eSave").addEventListener("click", function(){
      var name = document.getElementById("eName").value.trim();
      if (!name) return toast("请填姓名", true);
      var roles = Object.keys(picked).map(function(code){
        var sel = document.querySelector('#dBody [data-rlevel="' + code + '"]');
        return { code: code, level: sel ? sel.value : picked[code] };
      });
      if (!roles.length) return toast("至少选一个岗位", true);
      var dept = document.getElementById("eDept").value.trim();
      var load = Number(document.getElementById("eLoad").value || 0);
      var remark = document.getElementById("eRemark").value.trim();
      if (m){
        api("/api/manage/members/" + m.id, { method:"PATCH", body:{
          display_name: name, dept: dept, load_pct: load, remark: remark, roles: roles } })
          .then(function(){ closeDrawer(); toast("已保存"); loadOrg(); loadBrief(); })
          .catch(function(e){ toast(e.message, true); });
      } else {
        api("/api/manage/members", { method:"POST", body:{
          company_id: ACTIVE, display_name: name, dept: dept, load_pct: load, remark: remark,
          role_code: roles[0].code, level: roles[0].level } })
          .then(function(res){
            var mid = res && res.member && res.member.id;
            if (mid && roles.length > 1){
              return api("/api/manage/members/" + mid, { method:"PATCH", body:{ roles: roles } });
            }
          })
          .then(function(){ closeDrawer(); toast("已添加"); loadOrg(); loadBrief(); })
          .catch(function(e){ toast(e.message, true); });
      }
    });
  }

  function deleteMember(id){
    var m = ORG_CACHE.filter(function(x){ return x.id === id; })[0];
    if (!m) return;
    openDrawer("组织架构 · 删除成员", m.name,
      '<div class="dsec"><h4>确认删除</h4><div style="font-size:13px;line-height:1.7">将从公司移除 <b>'
      + m.name + '</b>，其岗位设置一并删除；不影响该账号在原系统的数据。</div></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="delNo">取消</button>'
      + '<button class="btn sm" id="delYes" style="background:linear-gradient(100deg,#fda4af,#fb7185);color:#210a10">确认删除</button></div>');
    document.getElementById("delNo").addEventListener("click", closeDrawer);
    document.getElementById("delYes").addEventListener("click", function(){
      api("/api/manage/members/" + id, { method:"DELETE" })
        .then(function(){ closeDrawer(); toast("已删除"); loadOrg(); loadBrief(); })
        .catch(function(e){ toast(e.message, true); });
    });
  }

  /* ================= 产品 ================= */
  var PROD_Q = "", PROD_CACHE = [];

  function loadProducts(){
    api("/api/manage/products?company_id=" + ACTIVE).then(function(d){
      PROD_CACHE = d.products || [];
      var k = PROD_Q.toLowerCase();
      var ps = PROD_CACHE.filter(function(x){
        if (!k) return true;
        return String(x.name||"").toLowerCase().indexOf(k) >= 0
            || String(x.description||"").toLowerCase().indexOf(k) >= 0;
      });
      $("#s-prod").innerHTML = '<div class="glass card">'
        + '<div class="row" style="align-items:center;gap:10px;margin-bottom:13px">'
        + '<b style="font-size:13.5px">产品</b>'
        + '<span class="dim" style="font-size:12px">销售的东西：价格 / 周期 / 交付物 / 说明</span>'
        + '<span class="grow"></span>'
        + '<input id="prodQ" placeholder="搜索产品" value="' + String(PROD_Q).replace(/"/g,"&quot;") + '" style="width:200px;height:34px" />'
        + '<button class="btn sm" id="addProd">＋ 新增产品</button></div>'
        + (ps.length ? '<div class="g3">' + ps.map(prodCard).join("") + '</div>'
                     : '<div class="dim">' + (PROD_Q ? "没有匹配的产品" : "还没有产品，点右上「新增产品」") + '</div>')
        + '</div>';
      var qi = document.getElementById("prodQ");
      qi.addEventListener("input", function(){
        clearTimeout(qi._t); var v = qi.value;
        qi._t = setTimeout(function(){ PROD_Q = v.trim(); loadProducts(); }, 300);
      });
      document.getElementById("addProd").addEventListener("click", function(){ openProductEditor(null); });
      $$("#s-prod [data-pedit]").forEach(function(b){
        b.addEventListener("click", function(){ openProductEditor(Number(b.dataset.pedit)); });
      });
      $$("#s-prod [data-pdel]").forEach(function(b){
        b.addEventListener("click", function(){ deleteProduct(Number(b.dataset.pdel)); });
      });
    }).catch(function(e){ showErr(e.message); });
  }

  function prodCard(x){
    return '<div class="glass card" style="padding:14px">'
      + '<div class="row" style="align-items:baseline;gap:9px">'
      + '<b style="font-size:13.5px">' + x.name + '</b><span class="grow"></span>'
      + '<span class="num" style="color:#7fe6f7">¥' + Number(x.price||0).toLocaleString("zh-CN")
      + (x.unit ? (" / " + x.unit) : "") + '</span></div>'
      + '<div class="dim" style="font-size:11.5px;margin-top:6px">'
      + (x.cycle_days ? ("周期 " + x.cycle_days + " 天") : "无固定周期")
      + (x.status === "active" ? ' · <span style="color:#6ee7b7">在售</span>' : ' · 已下架') + '</div>'
      + '<div class="mut" style="font-size:12.5px;margin-top:9px;line-height:1.65">' + (x.deliverable || "—") + '</div>'
      + (x.description ? '<div class="dim" style="font-size:11.5px;margin-top:7px">' + x.description + '</div>' : '')
      + '<div class="row" style="gap:7px;justify-content:flex-end;margin-top:11px">'
      + '<button class="btn sm ghost" data-pedit="' + x.id + '">编辑</button>'
      + '<button class="btn sm ghost" data-pdel="' + x.id + '" style="color:#fda4af;border-color:rgba(251,113,133,.4)">删除</button>'
      + '</div></div>';
  }

  function openProductEditor(id){
    var x = id ? PROD_CACHE.filter(function(y){ return y.id === id; })[0] : null;
    var html = '<div class="dsec"><h4>产品信息</h4>'
      + '<label class="fl">产品名称</label><input id="pdName" value="' + (x ? x.name : "") + '" style="margin-bottom:10px" placeholder="例如：抖音获客代运营" />'
      + '<div style="display:flex;gap:10px;margin-bottom:10px">'
      + '<div style="flex:1"><label class="fl">价格</label><input id="pdPrice" value="' + (x ? x.price : "") + '" placeholder="39800" /></div>'
      + '<div style="flex:0 0 110px"><label class="fl">单位</label><input id="pdUnit" value="' + (x ? (x.unit||"") : "") + '" placeholder="季 / 项目" /></div>'
      + '<div style="flex:0 0 110px"><label class="fl">周期(天)</label><input id="pdCycle" value="' + (x ? (x.cycle_days||"") : "") + '" placeholder="90" /></div></div>'
      + '<label class="fl">交付物</label><textarea id="pdDeliv" rows="2" placeholder="30 条短视频 + 4 场直播陪跑">' + (x ? (x.deliverable||"") : "") + '</textarea>'
      + '<label class="fl" style="margin-top:10px">说明 / 适用场景</label><input id="pdDesc" value="' + (x ? (x.description||"") : "") + '" /></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="pdCancel">取消</button>'
      + '<button class="btn sm" id="pdOk">' + (x ? "保存" : "创建") + '</button></div>';
    openDrawer(x ? "产品 · 编辑" : "产品 · 新增", x ? x.name : "新增产品", html);
    document.getElementById("pdCancel").addEventListener("click", closeDrawer);
    document.getElementById("pdOk").addEventListener("click", function(){
      var name = document.getElementById("pdName").value.trim();
      if (!name) return toast("请填产品名称", true);
      var payload = {
        name: name,
        price: Number(document.getElementById("pdPrice").value || 0),
        unit: document.getElementById("pdUnit").value.trim(),
        cycle_days: Number(document.getElementById("pdCycle").value || 0),
        deliverable: document.getElementById("pdDeliv").value.trim(),
        description: document.getElementById("pdDesc").value.trim(),
      };
      var req = x
        ? api("/api/manage/products/" + x.id, { method:"PATCH", body: payload })
        : api("/api/manage/products", { method:"POST", body: Object.assign({ company_id: ACTIVE }, payload) });
      req.then(function(){ closeDrawer(); toast(x ? "已保存" : "已创建"); loadProducts(); })
         .catch(function(e){ toast(e.message, true); });
    });
  }

  function deleteProduct(id){
    var x = PROD_CACHE.filter(function(y){ return y.id === id; })[0];
    if (!x) return;
    openDrawer("产品 · 删除", x.name,
      '<div class="dsec"><h4>确认删除</h4><div style="font-size:13px;line-height:1.7">将删除产品 <b>' + x.name
      + '</b>。已经选进项目的记录里仍保留名称，但不再出现在可选列表。</div></div>'
      + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="pdDelNo">取消</button>'
      + '<button class="btn sm" id="pdDelYes" style="background:linear-gradient(100deg,#fda4af,#fb7185);color:#210a10">确认删除</button></div>');
    document.getElementById("pdDelNo").addEventListener("click", closeDrawer);
    document.getElementById("pdDelYes").addEventListener("click", function(){
      api("/api/manage/products/" + id, { method:"DELETE" })
        .then(function(){ closeDrawer(); toast("已删除"); loadProducts(); })
        .catch(function(e){ toast(e.message, true); });
    });
  }

  /* ================= 达成条件 ================= */
  var CAT = { people:"人", money:"钱", device:"设备 / 虚拟员工", material:"素材 / 工具",
              channel:"渠道 / 关系", compliance:"资质 / 合规", time:"时间" };
  function loadCond(){
    api("/api/manage/conditions?company_id=" + ACTIVE).then(function(d){
      var cs = d.conditions || [];
      var pending = cs.filter(function(c){ return !c.decided; }).length;
      $("#s-cond").innerHTML = '<div class="glass card"><div class="row" style="align-items:center;gap:10px">'
        + '<span class="dot" style="color:#a855f7"></span><b style="font-size:13.5px">AI 达成条件分析</b>'
        + '<span class="dim" style="font-size:12px">以「把这个项目做成」为目标反推所需条件，不局限于现有资源</span>'
        + '<span class="grow"></span><span class="tag '+(pending?"wn":"ok")+'">'+(pending? pending+" 项需要补位":"全部已处理")+'</span></div>'
        + '<div class="dim" style="font-size:12px;margin-top:8px">招聘只是其中一种补位动作。AI 会同时考虑：人、钱、设备与虚拟员工、素材工具、渠道关系、资质、时间。</div></div>'
        + (cs.length ? '<div class="g3" style="margin-top:12px">' + cs.map(function(c, i){
            var lv = c.severity === "high" ? "var(--bad)" : (c.severity === "mid" || c.severity === "medium" ? "var(--warn)" : "var(--ok)");
            var label = c.severity === "high" ? "影响达成" : ((c.severity === "mid" || c.severity === "medium") ? "需关注" : "可缓冲");
            return '<div class="glass card" style="padding:14px'+(c.decided?';border-color:rgba(52,211,153,.35)':'')+'">'
              + '<div class="row" style="align-items:center;gap:9px;margin-bottom:9px">'
              + '<b style="font-size:13px">'+(CAT[c.category]||c.category)+' · '+c.title+'</b><span class="grow"></span>'
              + (c.decided ? '<span class="tag ok">已处理</span>' : '<span class="tag" style="color:'+lv+';border-color:'+lv+'66">'+label+'</span>')
              + '</div>'
              + (c.decided ? '<div style="font-size:12.5px;color:#6ee7b7">'+c.decided+'</div>'
                  : '<div style="font-size:12px;line-height:1.8">'
                    + '<div><span class="dim">需要</span> '+c.need+'</div>'
                    + '<div><span class="dim">现状</span> '+c.now+'</div>'
                    + '<div><span class="dim">缺口</span> <span style="color:'+lv+'">'+c.gap+'</span></div>'
                    + '<div style="margin-top:6px;color:var(--muted)">'+c.impact+'</div></div>'
                    + '<div style="height:1px;background:var(--w-line);margin:11px 0"></div>'
                    + (c.actions||[]).map(function(a, ai){
                        return '<div class="row" style="align-items:center;gap:9px;margin-bottom:7px">'
                          + '<span style="flex:1;font-size:12.5px">'+a.what+(a.when?'<span class="dim" style="margin-left:6px">'+a.when+'</span>':'')+'</span>'
                          + '<button class="btn sm '+(ai===0?"":"ghost")+'" data-cond="'+c.id+'" data-idx="'+ai+'">采纳</button></div>';
                      }).join(""))
              + '</div>';
          }).join("") + '</div>'
          : '<div class="glass card" style="margin-top:12px"><div class="dim">还没有条件分析：在项目里点「AI 生成规划」，AI 会同时给出达成条件与补位建议。</div></div>');
      $$("#s-cond [data-cond]").forEach(function(b){
        b.addEventListener("click", function(){
          api("/api/manage/conditions/" + b.dataset.cond + "/accept", { method:"POST", body:{ action_index: Number(b.dataset.idx) } })
            .then(function(){ toast("已采纳"); loadCond(); loadBrief(); })
            .catch(function(e){ toast(e.message, true); });
        });
      });
    }).catch(function(e){ showErr(e.message); });
  }

  /* ================= 财务 ================= */
  function loadFin(){
    api("/api/manage/finance?company_id=" + ACTIVE).then(function(d){
      var s = d.summary || {}, es = d.entries || [];
      var mm = function(v){ return "¥" + Number(v || 0).toLocaleString("zh-CN"); };
      $("#s-fin").innerHTML =
        '<div class="g4">'
        + '<div class="glass card kpi"><div class="t">收入</div><div class="v num">'+mm(s.income)+'</div></div>'
        + '<div class="glass card kpi"><div class="t">开销</div><div class="v num">'+mm(s.expense)+'</div></div>'
        + '<div class="glass card kpi"><div class="t">净额</div><div class="v num">'+mm(s.net)+'</div></div>'
        + '<div class="glass card kpi"><div class="t">笔数</div><div class="v num">'+es.length+'</div></div></div>'
        + '<div class="glass card" style="margin-top:12px">'
        + '<div class="row" style="align-items:center;margin-bottom:10px"><b style="font-size:13.5px">流水</b>'
        + '<span class="grow"></span><button class="btn sm" id="addFin">＋ 记一笔</button></div>'
        + (es.length ? '<table class="tb"><thead><tr><th>日期</th><th>类型</th><th>摘要</th><th class="right">金额</th></tr></thead><tbody>'
            + es.map(function(e){
                var c = e.type === "income" ? "#6ee7b7" : "#fda4af";
                return '<tr><td class="dim">'+e.on+'</td><td>'+(e.type==="income"?"收入":"开销")+'</td>'
                  + '<td class="mut">'+e.summary+'</td>'
                  + '<td class="right num" style="color:'+c+'">'+(e.type==="income"?"+":"-")+Number(e.amount||0).toLocaleString("zh-CN")+'</td></tr>';
              }).join("") + '</tbody></table>' : '<div class="dim">还没有流水。</div>')
        + '</div>';
      $("#addFin").addEventListener("click", function(){
        openDrawer("财务 · 记一笔", "收入 / 开销",
          '<div class="dsec"><label class="fl">类型</label><select id="fType"><option value="income">收入</option><option value="expense">开销</option></select>'
          + '<div style="margin-top:10px"><label class="fl">金额</label><input id="fAmt" placeholder="39800" /></div>'
          + '<div style="margin-top:10px"><label class="fl">摘要</label><input id="fSum" placeholder="客户回款 / 投放充值" /></div>'
          + '<div style="margin-top:10px"><label class="fl">日期</label><input id="fOn" placeholder="2026-09-14" /></div></div>'
          + '<div class="row" style="justify-content:flex-end;gap:9px"><button class="btn sm ghost" id="fCancel">取消</button>'
          + '<button class="btn sm" id="fOk">保存</button></div>');
        $("#fCancel").addEventListener("click", closeDrawer);
        $("#fOk").addEventListener("click", function(){
          api("/api/manage/finance", { method:"POST", body:{
            company_id: ACTIVE, entry_type: $("#fType").value,
            amount: Number($("#fAmt").value || 0), summary: $("#fSum").value.trim(),
            happened_on: $("#fOn").value.trim(),
          }}).then(function(){ closeDrawer(); toast("已记录"); loadFin(); loadBrief(); })
            .catch(function(e){ toast(e.message, true); });
        });
      });
    }).catch(function(e){ showErr(e.message); });
  }

  /* ---------- 初始化 ---------- */
  if (localStorage.getItem("manage_login_mode") === "admin"){ setLoginMode("admin"); }
  if (TOKEN){
    bootApp().catch(function(){ /* 已在 bootApp 里提示 */ });
  } else {
    fetch("/api/manage/health").catch(function(){});
  }
})();
</script>
</body>
</html>
