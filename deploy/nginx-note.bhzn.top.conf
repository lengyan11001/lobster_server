# 必火听记录 note.bhzn.top
# 依赖：证书需覆盖 note.bhzn.top（当前 bhzn.top 证书只有 bhzn.top/www/h5，
#       上线时先 certbot -d note.bhzn.top 扩签，或把本文件里的证书路径改成新 lineage）
server {
    listen 80;
    server_name note.bhzn.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name note.bhzn.top;

    ssl_certificate /etc/letsencrypt/live/bhzn.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhzn.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 220M;

    location / {
        gzip on;
        gzip_proxied any;
        gzip_min_length 512;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
    }
}
